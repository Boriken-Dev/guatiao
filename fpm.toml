# The Fortran bindings, for fpm's git dependencies, which read the
# manifest at a repository's root:
#
#   guatiao = { git = "https://github.com/Boriken-Dev/guatiao", tag = "..." }
#
# The package is bindings/fortran; its own fpm.toml is the one to work in.
name = "guatiao"
version = "0.0.0"
license = "MPL-2.0"
author = "jose-pr"
maintainer = "jose-pr@coqui.dev"
copyright = "jose-pr"
description = "Fortran bindings over the guatiao C ABI: values, schemas, documents, forms, and plugin libraries a host calls through typed function tables"
homepage = "https://github.com/Boriken-Dev/guatiao"
keywords = ["ffi", "plugins", "json-schema", "configuration"]

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[library]
source-dir = "bindings/fortran/src"

[install]
library = true
