[package]
name = "guatiao-rhai"
description = "A guatiao source of Rhai libraries: sandboxed scripts served to any host"
version = "0.0.0-alpha.1"
edition = "2024"
# The workspace's verified floor; Rhai's own is 1.66.
rust-version = "1.89"
repository = "https://github.com/Boriken-Dev/guatiao"
license = "MPL-2.0"
readme = "README.md"
# Built by its user from this repository: it is a file a host adds, and
# the release workflow does not package it.
publish = false
exclude = [".*", "*.local.*"]

# A workspace of its own: it is built as a file for a host to add, with
# libffi and Rhai compiled in, which no other build here needs.
[workspace]

[lib]
name = "guatiao_rhai"
# The cdylib is the source a host adds; the rlib is what a Rust host and
# the tests use.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
guatiao = { path = "../guatiao", version = "=0.0.0-alpha.1", features = ["load"] }
# Manifests, stamps, refresh, the source table, kinds served from their
# descriptions and the limits: Rhai is its engine.
guatiao-bridge = { path = "../guatiao-bridge", version = "=0.0.0-alpha.1" }
# Rhai has no FFI: its providers' tables, and its calls through a kind's
# table, are libffi closures and calls.
guatiao-libffi = { path = "../guatiao-libffi", version = "=0.0.0-alpha.1" }
rhai = { version = "=1.26.1" }
# How much of the engine thread's stack is left, checked between Rhai's
# operations: Rhai recurses on the native stack.
stacker = "=0.1.25"

[dev-dependencies]
# The kinds' traits, which a Rust host calls the Rhai greeters through.
greeter_kind = { path = "../../examples/greeter_kind" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
