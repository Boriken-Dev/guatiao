[package]
name = "guatiao-serde"
description = "serde for guatiao values -- one Serialize/DeserializeSeed pair, so every serde data format can carry one"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*", "public-api.txt"]

# docs.rs documents every feature.
[package.metadata.docs.rs]
all-features = true

[lib]
name = "guatiao_serde"
# A cdylib as well, because the `extern "C"` surface has to be IN an
# artifact for a C or Python host to load. An rlib exports nothing.
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[features]
# JSON on by default: it is the format a consumer reaches for without
# saying so. The others are named.
default = ["json"]

# `raw_value` only adds a type; it is what writes a number's exact text as a
# bare token. Reading a number goes through serde_json's own visitors, so
# one past `i64`/`u64` arrives as an `f64` (`1.10` as `1.1`).
json = ["dep:serde_json", "serde_json/raw_value"]

# A number read from JSON arrives as its own TEXT -- `1.10` stays `1.10`, a
# 200-digit integer survives -- because serde_json keeps it. Its own opt-in,
# not part of `json`: Cargo unifies features across a build, so this reaches
# `serde_json::Value` in every crate of the graph and breaks
# `#[serde(untagged)]` and `#[serde(flatten)]` numbers there.
exact-numbers = ["json", "serde_json/arbitrary_precision"]

# A TOML document is a TABLE: writing a bare scalar or array is refused
# rather than wrapped in a key the value never had.
toml = ["dep:toml"]

# `serde-saphyr` rather than the obvious names, which are gone:
# `serde_yaml` is deprecated and `serde_yml` describes ITSELF as an
# unmaintained shim. Of what is maintained this one forbids unsafe and
# emphasises panic-free parsing, which are the two properties that matter
# for reading a document somebody else wrote at an FFI boundary.
yaml = ["dep:serde-saphyr"]

# Renders `include/guatiao_serde.h` from the Rust that declares it. NOT the
# `extern "C"` surface, which is always compiled -- this is about the file
# that DECLARES it, which is committed and which most builds only read.
c-header = ["dep:cbindgen"]

[dependencies]
guatiao = { path = "../guatiao", version = "=0.0.0-alpha.0" }
# `derive` is NOT enabled: nothing here derives anything. The impls are
# written by hand because they carry a presentation policy and an
# allocator, neither of which a derive can express.
serde = { version = "1", default-features = false, features = ["std"] }

# Each named only by its feature above. This crate speaks serde; a format
# is a convenience it offers, not something it insists on.
serde_json = { version = "1", optional = true }
# `preserve_order`: a table is read in the order the document wrote it, as
# JSON and YAML are, rather than sorted.
toml = { version = "1", optional = true, features = ["preserve_order"] }
serde-saphyr = { version = "1", optional = true }

[build-dependencies]
# Optional, enabled only by `c-header`, so an ordinary build renders
# nothing and pulls in no generator.
cbindgen = { version = "0.29", optional = true }

[dev-dependencies]
# The formats the tests round-trip through. They are DEV dependencies on
# purpose: this crate speaks serde and takes no position on which format a
# consumer reaches for.
serde_json = { version = "1", features = ["raw_value"] }
# `derive` is for the test that a default build leaves other crates' numbers
# alone; the library itself derives nothing.
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
# A real JSON Schema 2020-12 validator, so "a schema IS a JSON Schema" is
# something a third party checked rather than something we assert. A DEV
# dependency of this crate and never of guatiao, which has none at all.
boon = "0.6"

[lints]
workspace = true
