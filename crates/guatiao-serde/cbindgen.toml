language = "C"
include_guard = "GUATIAO_SERDE_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
# Pinned rather than left to the platform: this file is COMMITTED, and a
# generated artifact whose line endings depend on where it was generated
# makes every regeneration a diff.
line_endings = "LF"

header = """
/*
 * This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at https://mozilla.org/MPL/2.0/.
 */

/*
 * guatiao-serde -- reading and writing a guatiao value as a document.
 *
 * GENERATED BY cbindgen, from build.rs. DO NOT EDIT BY HAND.
 * Regenerate with:
 *   GUATIAO_WRITE_HEADER=1 cargo build -p guatiao-serde --features c-header,json,toml,yaml
 *
 * ----------------------------------------------------------------------
 * EMITTING ANSWERS A VALUE, NOT A STRING.
 *
 * guatiao_json_emit() and friends write a guatiao_value holding the text,
 * which you release with guatiao_value_free() like any other tree. There
 * is no second thing to free, and the answer carries the allocator that
 * made it.
 *
 * The `how` argument is one integer: its LOW BYTE chooses how a byte
 * string is spelled where the format has none, and the bits above it are
 * flags. Zero is the default in every position.
 * ----------------------------------------------------------------------
 * A FORMAT IS A BUILD-TIME CHOICE, SO ITS DECLARATIONS ARE GUARDED.
 *
 * Only JSON is on by default. The TOML and YAML functions are in the
 * library only when it was built with those features, so this header
 * declares them only when you say the same thing:
 *
 *   cc -DGUATIAO_SERDE_TOML -DGUATIAO_SERDE_YAML ...
 *
 * Define the macro for each feature the library you link was built with.
 * Without it the declaration is absent, which is an error at the call
 * rather than a link failure nobody sees until later.
 * ----------------------------------------------------------------------
 */

#include "guatiao.h"
"""

# Every type in a signature here comes from `guatiao.h`, included above.
# Without this, cbindgen would emit its own incompatible copies.
[export]
exclude = [
  "Value",
  "Str",
  "Allocator",
  "Status",
]

# EXCLUDED ABOVE, RENAMED HERE, and both are needed: `exclude` stops
# cbindgen emitting its own incompatible copies, and this table is how it
# spells them in a SIGNATURE. Without it the header says `Status` and
# `Value`, which are the Rust names and are declared nowhere a C consumer
# can see -- the file then fails to compile on its first include.
[export.rename]
"Value" = "guatiao_value"
"Str" = "guatiao_str"
"Allocator" = "guatiao_alloc"
"Status" = "guatiao_status"
# A CARGO FEATURE BECOMES A C MACRO. cbindgen wraps everything behind
# `#[cfg(feature = "...")]` in `#if defined(...)`, so a header rendered
# with every format on still describes a library built with fewer: the
# declaration is there only when the consumer says the feature was.
#
# The render must still be done with all three on -- a render with `json`
# alone has nothing to guard, and would commit a header lacking the pairs
# entirely.
[defines]
"feature = toml" = "GUATIAO_SERDE_TOML"
"feature = yaml" = "GUATIAO_SERDE_YAML"

[parse]
parse_deps = false
