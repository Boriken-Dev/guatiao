language = "C"
include_guard = "GUATIAO_SERDE_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
# Pinned rather than left to the platform: this file is COMMITTED, and a
# generated artifact whose line endings depend on where it was generated
# makes every regeneration a diff.
line_endings = "LF"

header = """
/*
 * guatiao-serde -- reading and writing a guatiao value as a document.
 *
 * GENERATED BY cbindgen, from build.rs. DO NOT EDIT BY HAND.
 * Regenerate with:
 *   GUATIAO_WRITE_HEADER=1 cargo build -p guatiao-serde \
 *       --features c-header,json,toml,yaml
 *
 * ----------------------------------------------------------------------
 * EMITTING ANSWERS A VALUE, NOT A STRING.
 *
 * guatiao_json_emit() and friends write a guatiao_value holding the text,
 * which you release with guatiao_value_free() like any other tree. There
 * is no second thing to free, and the answer carries the allocator that
 * made it.
 *
 * The `how` argument is one integer: its LOW BYTE chooses how a byte
 * string is spelled where the format has none, and the bits above it are
 * flags. Zero is the default in every position.
 * ----------------------------------------------------------------------
 */

#include "guatiao.h"
"""

# Every type in a signature here comes from `guatiao.h`, included above.
# Without this, cbindgen would emit its own incompatible copies.
[export]
exclude = [
  "Value",
  "Str",
  "Allocator",
  "Status",
]

# EXCLUDED ABOVE, RENAMED HERE, and both are needed: `exclude` stops
# cbindgen emitting its own incompatible copies, and this table is how it
# spells them in a SIGNATURE. Without it the header says `Status` and
# `Value`, which are the Rust names and are declared nowhere a C consumer
# can see -- the file then fails to compile on its first include.
[export.rename]
"Value" = "guatiao_value"
"Str" = "guatiao_str"
"Allocator" = "guatiao_alloc"
"Status" = "guatiao_status"
[parse]
parse_deps = false
