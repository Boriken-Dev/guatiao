language = "C"
include_guard = "GUATIAO_FORM_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
# Pinned rather than left to the platform: this file is COMMITTED, and a
# generated artifact whose line endings depend on where it was generated
# makes every regeneration a diff.
line_endings = "LF"

header = """
/*
 * guatiao-form -- how a guatiao schema is shown.
 *
 * GENERATED BY cbindgen, from build.rs. DO NOT EDIT BY HAND.
 * Regenerate with:
 *   GUATIAO_WRITE_HEADER=1 cargo build -p guatiao-form --features c-header
 *
 * ----------------------------------------------------------------------
 * A FORM IS A VALUE. Read one, and build one, with guatiao.h's own
 * helpers: it is a map of "sections" (a list, in display order) and
 * "fields" (hints keyed by a field's path). Nothing here is needed to
 * read it.
 *
 * These three functions are the judgement -- the part two renderers would
 * otherwise each get differently: whether a form fits its schema, how its
 * fields are grouped and ordered, and whether one is showing.
 *
 * guatiao_form_layout() answers keys, not copies: everything else about a
 * field you already hold, through guatiao_schema_resolve() and the form
 * you passed in.
 * ----------------------------------------------------------------------
 */

#include "guatiao.h"
"""

# Every type in a signature here comes from `guatiao.h`, included above.
# Without this, cbindgen would emit its own incompatible copies.
[export]
exclude = [
  "Value",
  "Str",
  "Allocator",
  "Status",
]

# EXCLUDED ABOVE, RENAMED HERE, and both are needed: `exclude` stops
# cbindgen emitting its own copies, and this table is how it spells them in
# a SIGNATURE. Without it the header says `Value`, which is declared
# nowhere a C consumer can see.
[export.rename]
"Value" = "guatiao_value"
"Str" = "guatiao_str"
"Allocator" = "guatiao_alloc"
"Status" = "guatiao_status"

[parse]
parse_deps = false
