[package]
name = "guatiao"
description = "A C-struct value model, a schema for what a provider needs to be initialised, and an envelope -- one contract for passing configuration and providers between languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
# A category beats a list: `.*` drops every dot-prefixed directory at
# any depth, and `*.local.*` catches the unshared override that a dotfile
# pattern does not match (`AGENTS.local.md` does not start with a dot).
exclude = [".*", "*.local.*"]

[lib]
name = "guatiao"
path = "src/lib.rs"

# A DEFAULT BUILD PULLS IN NOTHING, and that is the property to preserve:
# a consumer must not take on a transitive dependency to read a value or a
# schema. Every dependency below is optional and default-off, so a feature
# nobody turns on costs such a consumer nothing.
[features]
default = []

# `#[derive(ToValue)]`, `#[derive(FromValue)]` and `#[derive(Schema)]`,
# re-exported from the crate
# root so a consumer writes `guatiao = { features = ["derive"] }` and never
# names the proc-macro crate -- serde's arrangement for `serde_derive`.
derive = ["dep:guatiao-derive"]

# `#[unsafe(no_mangle)] extern "C"` wrappers of the mutation API, for C and
# Dart callers. Exported by whichever artifact enables the feature; a Rust
# consumer calls the same functions directly and needs none of them.
#
# It also turns on the header render in `build.rs`, which is why cbindgen
# is an OPTIONAL build-dependency: the header describes this feature's
# surface, and a consumer that never enables it should not compile a code
# generator to build a header it will not read.
c-exports = ["dep:cbindgen"]

# `Registry::load_file` and `scan_dir`: mapping a library and calling its
# entry point, and finding which files are worth mapping.
# Off by default, so a library AUTHOR -- who needs the descriptors and the
# macro and never loads anything -- builds with no dependency at all.
#
# `object` is here rather than beside `libloading` by accident: a scan
# decides whether a file exports the entry symbol by READING its export
# table, never by mapping it, because mapping runs static initialisers
# that can abort the process. See `src/library/scan.rs`.
load = ["dep:libloading", "dep:object"]

[dependencies]
guatiao-derive = { path = "../guatiao-derive", version = "0.1.0", optional = true }
libloading = { version = "0.8", optional = true }
# Parses PE, ELF and Mach-O export tables as DATA. Default features off:
# this reads three formats and writes none, and a scan should not drag in
# a linker's worth of code.
object = { version = "0.40", optional = true, default-features = false, features = [
    "read_core",
    "pe",
    "elf",
    "macho",
    "std",
] }

[build-dependencies]
# Renders `include/guatiao.h`. Optional, and enabled only by `c-exports`,
# so a default build still pulls in nothing.
cbindgen = { version = "0.29", optional = true }

[dev-dependencies]
# Builds the example library as part of `cargo test`, so `library_load`
# finds a real artifact beside its own test binary rather than shelling
# out to cargo from inside a cargo run.
hello_library = { path = "../../examples/hello_library" }

# docs.rs documents every feature.
[package.metadata.docs.rs]
all-features = true
