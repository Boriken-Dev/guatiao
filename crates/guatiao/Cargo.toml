[package]
name = "guatiao"
# A build script key, not a native library: it lets `build.rs` publish
# where the committed header lives, so a consumer's own build script reads
# `DEP_GUATIAO_INCLUDE` and copies `guatiao.h` beside its own header.
links = "guatiao"
description = "A C-struct value model, a JSON Schema that describes a value, and an envelope for providers -- one contract for passing values between languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
# A category beats a list: `.*` drops every dot-prefixed directory at
# any depth, and `*.local.*` catches the unshared override that a dotfile
# pattern does not match (`AGENTS.local.md` does not start with a dot).
exclude = [".*", "*.local.*"]

[lib]
name = "guatiao"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

# A DEFAULT BUILD PULLS IN NOTHING, and that is the property to preserve:
# a consumer must not take on a transitive dependency to read a value or a
# schema. Every dependency below is optional and default-off, so a feature
# nobody turns on costs such a consumer nothing.
[features]
default = []

# `#[derive(ToValue)]`, `#[derive(FromValue)]` and `#[derive(Schema)]`,
# re-exported from the crate
# root so a consumer writes `guatiao = { features = ["derive"] }` and never
# names the proc-macro crate -- serde's arrangement for `serde_derive`.
derive = ["dep:guatiao-derive"]

# `#[guatiao::kind]` and `#[derive(Provider)]`: a provider kind as a Rust
# trait, with the table, the shims and the proxy generated. Turns on
# `syn/full` in the derive crate, which a consumer deriving only `Schema`
# should not pay for.
provider = ["derive", "guatiao-derive/provider"]

# Renders `include/guatiao.h` from the Rust that declares it.
#
# NOT the `extern "C"` surface — that is always compiled, because this is
# an FFI library and its symbols are not optional. This feature is about
# the DECLARATIONS: it pulls cbindgen in as a build-dependency and turns
# on the render in `build.rs`, so a consumer that never regenerates the
# committed header does not compile a code generator to produce a file it
# already has.
c-header = ["dep:cbindgen"]

# `Registry::load_file` and `scan_dir`: mapping a library and calling its
# entry point, and finding which files are worth mapping.
# Off by default, so a library AUTHOR -- who needs the descriptors and the
# macro and never loads anything -- builds with no dependency at all.
#
# `object` is here rather than beside `libloading` by accident: a scan
# decides whether a file exports the entry symbol by READING its export
# table, never by mapping it, because mapping runs static initialisers
# that can abort the process. See `src/library/scan.rs`.
load = ["dep:libloading", "dep:object"]

[dependencies]
guatiao-derive = { path = "../guatiao-derive", version = "0.1.0", optional = true }
libloading = { version = "0.8", optional = true }
# Parses PE, ELF and Mach-O export tables as DATA. Default features off:
# this reads three formats and writes none, and a scan should not drag in
# a linker's worth of code.
object = { version = "0.40", optional = true, default-features = false, features = [
    "read_core",
    "pe",
    "elf",
    "macho",
    "std",
] }

[build-dependencies]
# Renders `include/guatiao.h`. Optional, and enabled only by `c-header`,
# so a default build still pulls in nothing — the exported symbols are
# always compiled, but the generator that declares them is not.
cbindgen = { version = "0.29", optional = true }

[dev-dependencies]
# The scan tests look a macro-generated symbol up by name and call it,
# which needs the loader whether or not the `load` feature is on.
libloading = "0.8"
# Builds the example library as part of `cargo test`, so `library_load`
# finds a real artifact beside its own test binary rather than shelling
# out to cargo from inside a cargo run.
hello_library = { path = "../../examples/hello_library" }
# A library written with no glue, and the kind crate it and the test
# share, for `derived_library_load`.
derived_greeter = { path = "../../examples/derived_greeter" }
greeter_kind = { path = "../../examples/greeter_kind" }

# docs.rs documents every feature.
[package.metadata.docs.rs]
all-features = true
