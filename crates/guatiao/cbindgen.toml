language = "C"
include_guard = "GUATIAO_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
# Pinned rather than left to the platform: this file is COMMITTED, and a
# generated artifact whose line endings depend on where it was generated
# makes every regeneration a diff.
line_endings = "LF"

header = """
/* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at https://mozilla.org/MPL/2.0/. */

/*
 * guatiao -- the C form of the value model.
 *
 * GENERATED BY cbindgen, from build.rs. DO NOT EDIT BY HAND.
 * Regenerate with:
 *   GUATIAO_WRITE_HEADER=1 cargo build -p guatiao --features c-header
 * The build script renders this on every build and a test compares the
 * committed file against it, so an edit to the Rust that is not
 * regenerated fails the suite rather than shipping a header describing a
 * different ABI.
 *
 * ----------------------------------------------------------------------
 * READING A VALUE NEEDS NO LIBRARY AT ALL.
 *
 * Every type here is a plain struct or union, and the accessors at the
 * bottom of this file are `static inline`. You can read a whole tree --
 * walk a map, pull out a number's exact text -- with nothing linked.
 * Building and freeing one needs code; those functions are declared in
 * the middle of this file and are exported by any shared library built
 * from the guatiao crate.
 *
 * Strings and slices cross as pointer + length, never NUL-terminated, so
 * a key or a value may contain a NUL. Compare keys with
 * guatiao_str_eq(), never strcmp().
 *
 * A VIEW is {ptr, len} and is what every read hands back. An OWNED
 * container is {ptr, len, cap, alloc} and can be grown. A capacity of 0
 * means the buffer is NOT owned -- a literal, or a borrow -- and is never
 * freed, which is what lets you write a whole tree as a brace
 * initialiser and still pass it to guatiao_value_free().
 *
 * CHECK A VIEW'S LENGTH BEFORE ITS POINTER. An empty view may carry a
 * dangling pointer; it is never dereferenced when the length is zero.
 * ----------------------------------------------------------------------
 */
"""

# Forward-declared here rather than generated below, and this is not
# cosmetic. The type graph is cyclic -- value -> payload -> map -> entry ->
# value -- and cbindgen breaks that cycle at whichever edge its traversal
# reaches last, which is the one edge C cannot tolerate: it emits
# guatiao_entry, which embeds a guatiao_value BY VALUE, before
# guatiao_value exists. The result parses nowhere. Declaring the tag here
# and defining the struct in the trailer is order-independent, so it
# survives every future addition to this crate's exported surface.
after_includes = """

/* Forward declarations, so a container can hold a pointer to a type that
 * is not defined yet. Each of these types is defined at the BOTTOM of this
 * file, for the reason in cbindgen.toml: the type graph has by-value
 * cycles that a generator's traversal cannot order for C, and only an
 * explicit forward declaration breaks them.
 *
 * A pointer to an incomplete type is fine; a FIELD of one is not, which is
 * exactly which types had to move. */
typedef struct guatiao_entry guatiao_entry;
"""

sys_includes = ["string.h", "errno.h", "limits.h"]

# `guatiao_entry` is defined HERE rather than generated, for the ordering
# reason in `after_includes`. Everything else below is what makes the
# headline claim true: reading a value needs no library at all.
#
# The guard is required, not belt-and-braces: a trailer is written AFTER
# the file's own `#endif`, so without it a second `#include` redefines
# everything in here.
trailer = '''
/* ======================================================================
 * guatiao_entry, and the accessors that need nothing linked.
 * ====================================================================== */

#ifndef GUATIAO_ENTRY_DEFINED
#define GUATIAO_ENTRY_DEFINED

/*
 One key/value pair of a map. The value is held INLINE, not by pointer, so
 a map is one contiguous array.

 Defined here rather than above because the type graph is cyclic and a
 generator cannot order it for C; see the forward declaration near the top.
 Its layout is pinned by the static assertions a consumer can copy from
 this crate's own C test.
 */
struct guatiao_entry {
  /* Raw bytes. No case folding, no normalisation: "Host" and "host" are
     two keys, and a key may contain a NUL. */
  guatiao_string key;
  guatiao_value value;
};

/* ---- views out of owned containers ---------------------------------- */

static inline guatiao_str guatiao_string_view(const guatiao_string *s) {
  guatiao_str out;
  out.ptr = s ? s->ptr : NULL;
  out.len = s ? s->len : 0;
  return out;
}

static inline guatiao_bytes guatiao_buffer_view(const guatiao_buffer *b) {
  guatiao_bytes out;
  out.ptr = b ? b->ptr : NULL;
  out.len = b ? b->len : 0;
  return out;
}

static inline guatiao_values guatiao_list_view(const guatiao_list *l) {
  guatiao_values out;
  out.ptr = l ? l->ptr : NULL;
  out.len = l ? l->len : 0;
  return out;
}

static inline guatiao_entries guatiao_map_view(const guatiao_map *m) {
  guatiao_entries out;
  out.ptr = m ? m->ptr : NULL;
  out.len = m ? m->len : 0;
  return out;
}

/* ---- building a view from your own memory --------------------------- */

static inline guatiao_str guatiao_str_from(const char *p, size_t len) {
  guatiao_str out;
  out.ptr = (const uint8_t *)p;
  out.len = len;
  return out;
}

/* From a NUL-terminated C string. The NUL is NOT stored: guatiao strings
   carry an explicit length, so this is a convenience for callers who
   happen to have a `char *`, not the storage format. */
static inline guatiao_str guatiao_cstr(const char *p) {
  return guatiao_str_from(p, p ? strlen(p) : 0);
}

static inline guatiao_bytes guatiao_bytes_from(const void *p, size_t len) {
  guatiao_bytes out;
  out.ptr = (const uint8_t *)p;
  out.len = len;
  return out;
}

/* ---- reading a value ------------------------------------------------- */

/* Every accessor below answers for a NULL value rather than faulting: a
   null is the first thing that arrives when a preceding call failed and
   its result went unchecked, and faulting there loses the real error. */

static inline uint32_t guatiao_tag_of(const guatiao_value *v) {
  return v ? v->tag : (uint32_t)GUATIAO_ABSENT;
}

/* The exact text of a NUMBER, verbatim. Empty for any other kind.

   THIS IS THE ACCESSOR THAT CANNOT LIE. A number is stored as the text
   that declared it, so "1.10" reads back as "1.10" and a 200-digit
   integer survives -- nothing ever converted it. */
static inline guatiao_str guatiao_number_text(const guatiao_value *v) {
  guatiao_str out;
  out.ptr = NULL;
  out.len = 0;
  if (v && v->tag == (uint32_t)GUATIAO_NUMBER) {
    out = guatiao_string_view(&v->payload.number);
  }
  return out;
}

/* The text of a STRING. Empty for any other kind, a NUMBER included: the
   kinds are distinct and nothing coerces between them. */
static inline guatiao_str guatiao_string_text(const guatiao_value *v) {
  guatiao_str out;
  out.ptr = NULL;
  out.len = 0;
  if (v && v->tag == (uint32_t)GUATIAO_STRING) {
    out = guatiao_string_view(&v->payload.text);
  }
  return out;
}

static inline guatiao_bytes guatiao_bytes_data(const guatiao_value *v) {
  guatiao_bytes out;
  out.ptr = NULL;
  out.len = 0;
  if (v && v->tag == (uint32_t)GUATIAO_BYTES) {
    out = guatiao_buffer_view(&v->payload.bytes);
  }
  return out;
}

static inline guatiao_values guatiao_list_items(const guatiao_value *v) {
  guatiao_values out;
  out.ptr = NULL;
  out.len = 0;
  if (v && v->tag == (uint32_t)GUATIAO_LIST) {
    out = guatiao_list_view(&v->payload.list);
  }
  return out;
}

static inline guatiao_entries guatiao_map_entries(const guatiao_value *v) {
  guatiao_entries out;
  out.ptr = NULL;
  out.len = 0;
  if (v && v->tag == (uint32_t)GUATIAO_MAP) {
    out = guatiao_map_view(&v->payload.map);
  }
  return out;
}

/* ---- lookup ---------------------------------------------------------- */

/* Byte equality. USE THIS, NOT strcmp: a key carries an explicit length
   and may contain a NUL, so strcmp would report two different keys as the
   same one. */
static inline bool guatiao_str_eq(guatiao_str a, guatiao_str b) {
  if (a.len != b.len) {
    return false;
  }
  if (a.len == 0) {
    return true;
  }
  return memcmp(a.ptr, b.ptr, a.len) == 0;
}

static inline guatiao_str guatiao_entry_key(const guatiao_entry *e) {
  guatiao_str out;
  out.ptr = NULL;
  out.len = 0;
  if (e) {
    out = guatiao_string_view(&e->key);
  }
  return out;
}

/* The value under `key`, or NULL. Linear, which is the right shape for a
   metadata container of tens of keys held in contiguous memory. */
static inline const guatiao_value *guatiao_map_find(const guatiao_value *v,
                                                    guatiao_str key) {
  guatiao_entries es = guatiao_map_entries(v);
  size_t i;
  for (i = 0; i < es.len; i++) {
    if (guatiao_str_eq(guatiao_entry_key(&es.ptr[i]), key)) {
      return &es.ptr[i].value;
    }
  }
  return NULL;
}

static inline const guatiao_value *guatiao_list_at(const guatiao_value *v,
                                                   size_t index) {
  guatiao_values items = guatiao_list_items(v);
  return index < items.len ? &items.ptr[index] : NULL;
}

/* ---- typed reads, with a caller's default ---------------------------- */

/* Each of these collapses absent, wrong-kind and not-representable into
   the caller's default, which is right for the overwhelmingly common call.
   A caller that must tell them apart has guatiao_tag_of() and
   guatiao_number_text(), which hands back the exact text whatever its
   magnitude. */

static inline bool guatiao_bool_or(const guatiao_value *v, bool fallback) {
  if (!v || v->tag != (uint32_t)GUATIAO_BOOL) {
    return fallback;
  }
  return v->payload.b;
}

/*
 A number as an int64_t, or `fallback`.

 IT NEVER TRUNCATES, and that is the whole reason this exists rather than
 leaving every consumer to call strtoll. `fallback` is answered for a
 value outside int64_t's range, one with a fractional part, and one
 written with an exponent -- `1e2` is integral in value but not in
 spelling, and evaluating the exponent correctly for arbitrary precision
 is the arithmetic this container exists to avoid. strtoll would instead
 SATURATE to LLONG_MAX and set errno, which is a wrong answer that looks
 like a right one.
 */
static inline int64_t guatiao_int_or(const guatiao_value *v, int64_t fallback) {
  guatiao_str t = guatiao_number_text(v);
  char buf[48];
  char *end = NULL;
  long long parsed;
  size_t i;
  if (t.len == 0 || t.len >= sizeof(buf)) {
    return fallback;
  }
  for (i = 0; i < t.len; i++) {
    char c = (char)t.ptr[i];
    if (c == '.' || c == 'e' || c == 'E') {
      return fallback; /* fractional or exponent: not an integer spelling */
    }
    buf[i] = c;
  }
  buf[t.len] = '\0';
  errno = 0;
  parsed = strtoll(buf, &end, 10);
  if (errno != 0 || end != buf + t.len) {
    return fallback;
  }
  return (int64_t)parsed;
}

/*
 A number as the nearest double, or `fallback` when there is no finite one.

 Lossy by construction: a double has 53 bits of mantissa, so a value
 needing more comes back rounded and nothing here reports it.
 */
static inline double guatiao_float_or(const guatiao_value *v, double fallback) {
  guatiao_str t = guatiao_number_text(v);
  char buf[344]; /* wide enough for any double's decimal spelling */
  char *end = NULL;
  double parsed;
  if (t.len == 0 || t.len >= sizeof(buf)) {
    return fallback;
  }
  memcpy(buf, t.ptr, t.len);
  buf[t.len] = '\0';
  errno = 0;
  parsed = strtod(buf, &end);
  if (end != buf + t.len || errno == ERANGE) {
    return fallback;
  }
  return parsed;
}

/* ---- the keys a schema is written with -------------------------------
 *
 * A schema IS a value, so reading one is walking a map -- with these key
 * names, which are JSON Schema's own (2020-12) plus the x- prefixed ones
 * this crate adds. They are macros rather than a second set of structs
 * for the same reason the schema is data: a consumer compares a key it
 * read against one of these and needs nothing linked.
 *
 * GUATIAO_KEY_DIALECT is the value of GUATIAO_KEY_SCHEMA on a root
 * document, not a key. The GUATIAO_KEY_TYPE_* names are the values
 * GUATIAO_KEY_TYPE takes.
 */

#define GUATIAO_KEY_SCHEMA "$schema"
#define GUATIAO_KEY_DIALECT "https://json-schema.org/draft/2020-12/schema"
#define GUATIAO_KEY_TYPE "type"
#define GUATIAO_KEY_TITLE "title"
#define GUATIAO_KEY_DESCRIPTION "description"
#define GUATIAO_KEY_DEFAULT "default"
#define GUATIAO_KEY_PROPERTIES "properties"
#define GUATIAO_KEY_REQUIRED "required"
#define GUATIAO_KEY_ADDITIONAL_PROPERTIES "additionalProperties"
#define GUATIAO_KEY_ITEMS "items"
#define GUATIAO_KEY_MINIMUM "minimum"
#define GUATIAO_KEY_MAXIMUM "maximum"
#define GUATIAO_KEY_ENUM "enum"
#define GUATIAO_KEY_CONST "const"
#define GUATIAO_KEY_ANY_OF "anyOf"
#define GUATIAO_KEY_ONE_OF "oneOf"
#define GUATIAO_KEY_X_SECTION "x-section"
#define GUATIAO_KEY_X_ORDER "x-order"
#define GUATIAO_KEY_X_ADVANCED "x-advanced"
#define GUATIAO_KEY_X_SENSITIVE "x-sensitive"
#define GUATIAO_KEY_X_ENUM_LABELS "x-enum-labels"
#define GUATIAO_KEY_X_VARIANT_TAG "x-variant-tag"
#define GUATIAO_KEY_TYPE_BOOLEAN "boolean"
#define GUATIAO_KEY_TYPE_INTEGER "integer"
#define GUATIAO_KEY_TYPE_NUMBER "number"
#define GUATIAO_KEY_TYPE_STRING "string"
#define GUATIAO_KEY_TYPE_ARRAY "array"
#define GUATIAO_KEY_TYPE_OBJECT "object"
#define GUATIAO_KEY_TYPE_BYTES "bytes"

/* ---- writing a tree as a literal ------------------------------------- */

/*
 A statically declared value. Every owned field gets cap 0 and a NULL
 allocator, which is what marks the storage as NOT OURS: such a buffer is
 never freed, so a literal tree may be passed to guatiao_value_free()
 safely, and the first append copies out of it and leaves it untouched.

 ONLY GROWTH COPIES OUT. Mutating a literal in place -- guatiao_map_set()
 over a key it already has, guatiao_map_discard(), guatiao_list_discard(),
 guatiao_map_clear(), guatiao_list_clear() -- shifts elements and frees
 values THROUGH THE ARRAY YOU DECLARED, whatever its capacity says. So a
 literal you intend to mutate must live in writable storage: a static
 without const, or a local. One in read-only memory may be read, cloned,
 merged, grown and freed, but not emptied.

 C only. A C++ caller builds the same thing with the functions above.
 */
#ifndef __cplusplus

#define GUATIAO_STRING_LIT(lit) \
  { (uint8_t *)(lit), sizeof(lit) - 1, 0, NULL }

#define GUATIAO_VALUE_STRING_LIT(lit) \
  { (uint32_t)GUATIAO_STRING, 0, { .text = GUATIAO_STRING_LIT(lit) } }

#define GUATIAO_VALUE_NUMBER_LIT(lit) \
  { (uint32_t)GUATIAO_NUMBER, 0, { .text = GUATIAO_STRING_LIT(lit) } }

#define GUATIAO_VALUE_BOOL_LIT(v) \
  { (uint32_t)GUATIAO_BOOL, 0, { .b = (v) ? true : false } }

#define GUATIAO_VALUE_NULL_LIT \
  { (uint32_t)GUATIAO_NULL, 0, { .b = false } }

/* A map or list over an array you declared yourself. */
#define GUATIAO_VALUE_MAP_LIT(arr) \
  { (uint32_t)GUATIAO_MAP, 0, \
    { .map = { (guatiao_entry *)(arr), sizeof(arr) / sizeof((arr)[0]), 0, NULL } } }

#define GUATIAO_VALUE_LIST_LIT(arr) \
  { (uint32_t)GUATIAO_LIST, 0, \
    { .list = { (guatiao_value *)(arr), sizeof(arr) / sizeof((arr)[0]), 0, NULL } } }

/* A byte array you declared yourself. */
#define GUATIAO_VALUE_BYTES_LIT(arr)   { (uint32_t)GUATIAO_BYTES, 0,     { .bytes = { (uint8_t *)(arr), sizeof(arr), 0, NULL } } }

/* Variadic, and it has to be: a value literal is a brace list, and a brace
   list handed to a fixed-arity macro splits at its own commas. */
#define GUATIAO_ENTRY_LIT(k, ...) { GUATIAO_STRING_LIT(k), __VA_ARGS__ }

/*
 An allocator over the C library, for a caller with no reason to supply
 its own. It must outlive every tree built through it.

 malloc guarantees only max_align_t, which is enough for every type this
 header declares and is asserted as such in this crate's own C test. Do
 NOT pair _aligned_malloc with free here: the two slots are a matched
 pair, and mixing them corrupts the heap.
 */
#define GUATIAO_ALLOC_MALLOC \
  { (uint32_t)sizeof(guatiao_alloc), NULL, \
    guatiao_malloc_alloc, guatiao_malloc_free, NULL }

static inline void *guatiao_malloc_alloc(void *ctx, size_t size, size_t align) {
  (void)ctx;
  (void)align;
  return size ? malloc(size) : NULL;
}

static inline void guatiao_malloc_free(void *ctx, void *p, size_t size,
                                       size_t align) {
  (void)ctx;
  (void)size;
  (void)align;
  free(p);
}

#endif /* __cplusplus */

#endif /* GUATIAO_ENTRY_DEFINED */
'''

[export]
# Everything public, listed. A type not named in an exported function's
# signature is otherwise DROPPED SILENTLY -- exit 0, no warning -- which
# for a committed header is an API hole that only shows up in somebody
# else's consumer.
include = [
  "Tag",
  "Status",
  "Str",
  "Bytes",
  "Values",
  "Entries",
  "Text",
  "Buffer",
  "List",
  "Map",
  "Payload",
  "Value",
  "Entry",
  "Allocator",
  "HostInfo",
  "HostServices",
  "LibraryInfo",
  "ProviderInfo",
  "Providers",
  "Kinds",
  "KindTable",
  "KindTables",
  "KindHeader",
  "ProviderError",
  "ObjectRaw",
  "BytesMut",
  "MergeOverride",
]
# `Entry` is defined in the trailer instead; see `after_includes`.
exclude = ["Entry"]

# A public C header shares one flat namespace with everything a consumer
# already includes, so every name it introduces carries this crate's
# prefix. `SEPARATOR` as a bare macro would collide with somebody's own,
# and the collision would be a confusing redefinition rather than a
# missing symbol. The Rust name stays idiomatic where it is read as
# `flat::SEPARATOR`.
[export.rename]
"SEPARATOR" = "GUATIAO_PAYLOAD_SEPARATOR"
"MAX_DEPTH" = "GUATIAO_MAX_DEPTH"

# The types are named for Rust on the Rust side — `Value`, `Map`, `List`
# — and for C on the C side. A header shares one flat namespace with
# everything a consumer already includes, so every name it introduces
# carries this crate's prefix; inside a crate that is already called
# `guatiao`, repeating the prefix in every type name would be noise.
#
# This table is the whole of that translation, and
# `tests/header_covers_every_type.rs` is what catches a type that fell out
# of it.
"Value" = "guatiao_value"
"Entry" = "guatiao_entry"
"Payload" = "guatiao_payload"
"Tag" = "guatiao_tag"
"Map" = "guatiao_map"
"List" = "guatiao_list"
"Text" = "guatiao_string"
# `repr(transparent)` over `Text`: renders as a typedef of it.
"Number" = "guatiao_number"
"Buffer" = "guatiao_buffer"
"Str" = "guatiao_str"
"Bytes" = "guatiao_bytes"
"Values" = "guatiao_values"
"Entries" = "guatiao_entries"
"Allocator" = "guatiao_alloc"
"Status" = "guatiao_status"
"HostInfo" = "guatiao_host_info"
"HostServices" = "guatiao_host_services"
"LibraryInfo" = "guatiao_library_info"
"ProviderInfo" = "guatiao_provider_info"
"Providers" = "guatiao_providers"
"Kinds" = "guatiao_kinds"
"KindTable" = "guatiao_kind_table"
"KindTables" = "guatiao_kind_tables"
"KindHeader" = "guatiao_kind_header"
"ProviderError" = "guatiao_provider_error"
"ObjectRaw" = "guatiao_object"
"BytesMut" = "guatiao_bytes_mut"
# The one opaque handle. A registry owns growable collections and changes
# over time, which is what a handle is for and what a repr(C) struct is not.
"HostRegistry" = "guatiao_registry"
"ABI_VERSION" = "GUATIAO_ABI_VERSION"
"MergeOverride" = "guatiao_merge_override"
# cbindgen monomorphises the generic newtype and emits the Rust name.
# A header shares one flat namespace, so the typedef it introduces has to
# carry the prefix like every other name here.
"MaybeNull_Map" = "guatiao_map_ptr"

[parse]
parse_deps = false
