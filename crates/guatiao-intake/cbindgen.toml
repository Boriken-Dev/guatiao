language = "C"
include_guard = "GUATIAO_INTAKE_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
# Pinned rather than left to the platform: this file is COMMITTED, and a
# generated artifact whose line endings depend on where it was generated
# makes every regeneration a diff.
line_endings = "LF"

header = """
/*
 * This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at https://mozilla.org/MPL/2.0/.
 */

/*
 * guatiao-intake -- how a guatiao schema is shown.
 *
 * GENERATED BY cbindgen, from build.rs. DO NOT EDIT BY HAND.
 * Regenerate with:
 *   GUATIAO_WRITE_HEADER=1 cargo build -p guatiao-intake --features c-header
 *
 * ----------------------------------------------------------------------
 * A FORM IS A VALUE. Read one, and build one, with guatiao.h's own
 * helpers: it is a map of "sections" (a list, in display order) and
 * "fields" (hints keyed by a field's path). Nothing here is needed to
 * read it.
 *
 * These three functions are the judgement -- the part two renderers would
 * otherwise each get differently: whether a form fits its schema, how its
 * fields are grouped and ordered, and whether one is showing.
 *
 * guatiao_intake_layout() answers keys, not copies: everything else about a
 * field you already hold, through guatiao_intake_resolve() and the form
 * you passed in.
 * ----------------------------------------------------------------------
 */

#include "guatiao.h"
"""

# The three keys this library writes onto a SCHEMA, beside a field. They
# are not form-document keys and they are not in guatiao.h: `guatiao` does
# not name them, because how to group and order controls is an opinion it
# does not hold. A C consumer that reads them includes this header, which
# is the honest statement of where they come from.
trailer = """

/* ---- what this library writes onto a schema field -------------------- */

#define GUATIAO_INTAKE_KEY_X_SECTION "x-section"
#define GUATIAO_INTAKE_KEY_X_ORDER "x-order"
#define GUATIAO_INTAKE_KEY_X_ADVANCED "x-advanced"
"""

# Every type in a signature here comes from `guatiao.h`, included above.
# Without this, cbindgen would emit its own incompatible copies.
[export]
exclude = [
  "Value",
  "Str",
  "Allocator",
  "Status",
]

# EXCLUDED ABOVE, RENAMED HERE, and both are needed: `exclude` stops
# cbindgen emitting its own copies, and this table is how it spells them in
# a SIGNATURE. Without it the header says `Value`, which is declared
# nowhere a C consumer can see.
[export.rename]
"Value" = "guatiao_value"
"Str" = "guatiao_str"
"Allocator" = "guatiao_alloc"
"Status" = "guatiao_status"

[parse]
parse_deps = false
