[package]
name = "guatiao-lua"
description = "A guatiao source of Lua libraries, and the Lua side of guatiao: values, kinds and a registry from Lua"
version = "0.0.0-alpha.1"
edition = "2024"
# mlua's own floor is 1.88; the workspace's is the verified one.
rust-version = "1.89"
repository = "https://github.com/Boriken-Dev/guatiao"
license = "MPL-2.0"
readme = "README.md"
# Built by its user from this repository, with the Lua flavour they
# choose; the release workflow does not package it.
publish = false
exclude = [".*", "*.local.*"]

# A workspace of its own: its Lua flavours are exclusive features, which
# the root workspace's `--all-features` legs could not build together.
[workspace]

[lib]
name = "guatiao_lua"
# The cdylib is the source a host adds; the rlib is what the loadable
# module (`bindings/lua/guatiao`) builds on.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["lua54", "source"]

# The Lua it runs or is loaded by: exactly one.
lua54 = ["mlua/lua54"]
lua55 = ["mlua/lua55"]
# Luau, with its sandbox on: libraries cannot change the standard ones.
luau = ["mlua/luau"]
# LuaJIT, for the loadable module only: its operations limit does not hold
# for compiled code, so no source runs on it.
luajit = ["mlua/luajit"]

# The source: Lua built from its C sources into this file, and
# `guatiao_source` exported. Exclusive with `module`.
source = ["mlua/vendored"]
# Built to be loaded by a Lua interpreter, against the Lua it is loaded by.
module = ["mlua/module"]

[dependencies]
guatiao = { path = "../guatiao", version = "=0.0.0-alpha.1", features = ["load", "dynamic-kinds"] }
# Manifests, stamps, refresh, the source table, kinds served from their
# descriptions and the limits: Lua is its engine.
guatiao-bridge = { path = "../guatiao-bridge", version = "=0.0.0-alpha.1", features = ["dynamic-kinds"] }
mlua = { version = "0.12.2" }

[dev-dependencies]
# The kinds' traits, which a Rust host calls the Lua greeters through.
greeter_kind = { path = "../../examples/greeter_kind" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
