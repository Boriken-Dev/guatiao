[package]
name = "guatiao-builder"
description = "guatiao's side of coqui-builder: a schema, a filled Partial and a checked value made from a description, so any struct built field by field can be shown in a form, held as a guatiao value or read from one"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# coqui-builder is a git dependency until it is released, and a crate with
# one cannot be published.
publish = false
license.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*", "public-api.txt"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "guatiao_builder"
path = "src/lib.rs"

[dependencies]
guatiao = { path = "../guatiao", version = "=0.0.0-alpha.1" }
guatiao-intake = { path = "../guatiao-intake", version = "=0.0.0-alpha.1" }
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "14aca5d74ef435543f9258dd0a29fab7bb596eab" }

[dev-dependencies]
# Both derives on one fixture, so the two descriptions can be compared.
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "14aca5d74ef435543f9258dd0a29fab7bb596eab", features = ["derive", "zeroize"] }
guatiao = { path = "../guatiao", features = ["derive"] }
guatiao-serde = { path = "../guatiao-serde", features = ["json"] }
serde_json = "1"

[lints]
workspace = true
