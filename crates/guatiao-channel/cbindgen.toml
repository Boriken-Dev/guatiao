language = "C"
include_guard = "GUATIAO_CHANNEL_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
line_endings = "LF"
sys_includes = ["guatiao.h"]

header = """
/* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at https://mozilla.org/MPL/2.0/. */

/*
 * guatiao_channel -- a two-way stream of bytes between a host and a
 * provider: the `channel` and `channel_sink` object kinds' tables.
 *
 * GENERATED BY cbindgen, from build.rs, by expanding #[guatiao::kind].
 * DO NOT EDIT BY HAND. Regenerate with:
 *   GUATIAO_WRITE_HEADER=1 cargo build -p guatiao-channel --features c-header
 *
 * A provider fills a channel_vtable and hands it back as a guatiao_object;
 * a host fills a channel_sink_vtable and hands it in. `header.struct_size`
 * is sizeof the table, `header.floor_hash` the *_FLOOR_HASH macro beside
 * it, and `destroy` comes first, called by whoever holds the object last.
 *
 * The rules both sides keep:
 *  - send and receive return once the other side has taken the message;
 *    neither answers GUATIAO_ERR_BUSY or times out.
 *  - messages keep their call order per direction; the provider calls
 *    receive from one thread at a time.
 *  - after close (or destroying the channel, close(GUATIAO_OK)), send
 *    answers GUATIAO_ERR_GONE and the provider calls closed with the
 *    host's status once, unless it already had, then never the sink again.
 *  - after closed from the provider, send answers GUATIAO_ERR_GONE.
 *  - a host that takes nothing more answers GUATIAO_ERR_GONE from receive;
 *    any error from receive ends the stream: closed with that status.
 */
"""

[export]
include = ["ChannelVtable", "ChannelSinkVtable"]

[export.rename]
"ChannelVtable" = "channel_vtable"
"ChannelSinkVtable" = "channel_sink_vtable"

[parse]
parse_deps = false

[parse.expand]
crates = ["guatiao-channel"]
