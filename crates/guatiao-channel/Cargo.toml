[package]
name = "guatiao-channel"
description = "A two-way stream of bytes between a host and a provider, as two guatiao object kinds with stated rules: back-pressure, ordering and closing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*", "public-api.txt"]
build = "build.rs"

[lib]
name = "guatiao_channel"
path = "src/lib.rs"

[dependencies]
guatiao = { path = "../guatiao", version = "=0.0.0-alpha.1", features = ["provider"] }

[features]
# Renders `include/guatiao_channel.h`, the two tables as C structs. Off by
# default, as guatiao's own: the header is committed, and a build that only
# reads it compiles no code generator.
c-header = ["dep:cbindgen"]

[build-dependencies]
cbindgen = { version = "0.29", optional = true }

[dev-dependencies]
# Writes the kinds' description as indented JSON.
guatiao-serde = { path = "../guatiao-serde", features = ["json"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
