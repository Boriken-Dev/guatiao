[package]
name = "guatiao-libffi"
description = "libffi as a guatiao mechanism: function pointers for, and calls through, kind tables built at run time from a kind's description"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*", "public-api.txt"]

[lib]
name = "guatiao_libffi"
path = "src/lib.rs"

[dependencies]
guatiao = { path = "../guatiao", version = "=0.0.0-alpha.1" }
# Builds libffi from C source: MSVC's tools on Windows, `configure` and
# `make` elsewhere. On a Windows MSVC target a `CC` naming a GNU-style
# compiler (`clang`) breaks that build, so leave `CC` unset for cargo.
libffi = "5.2"

[dev-dependencies]
guatiao = { path = "../guatiao", features = ["provider", "load"] }
# Reads the example kinds' descriptions.
guatiao-serde = { path = "../guatiao-serde", features = ["json"] }
# The example kinds the tests build tables for.
greeter_kind = { path = "../../examples/greeter_kind" }
# Loads the C caller `tests/described_kinds.rs` compiles.
libloading = "0.8"

[lints]
workspace = true
