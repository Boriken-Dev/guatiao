[package]
name = "guatiao-bridge"
description = "What every guatiao bridge to a language runtime shares: an engine trait, its thread, manifests and stamps, the glue to a source, and kinds served from their descriptions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*", "public-api.txt"]

# docs.rs documents every feature.
[package.metadata.docs.rs]
all-features = true

[lib]
name = "guatiao_bridge"
path = "src/lib.rs"

[features]
default = []

# Providers an engine declares get kind tables built at run time from
# their kinds' descriptions: what an engine with no FFI of its own (Lua,
# JavaScript, Rhai, wasm) serves through. Turns on guatiao's
# `dynamic-kinds`, which builds libffi from C.
dynamic-kinds = ["guatiao/dynamic-kinds"]

[dependencies]
guatiao = { path = "../guatiao", version = "=0.0.0-alpha.1" }
# TOML for manifests, JSON for kind descriptions and the shared vectors.
guatiao-serde = { path = "../guatiao-serde", version = "=0.0.0-alpha.1", default-features = false, features = [
    "json",
    "toml",
] }

[dev-dependencies]
guatiao = { path = "../guatiao", features = ["provider", "load"] }
# The example kinds the test engine serves.
greeter_kind = { path = "../../examples/greeter_kind" }

[lints]
workspace = true
