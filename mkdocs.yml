site_name: guatiao
site_description: One contract for passing configuration and providers between languages
site_url: https://boriken-dev.github.io/guatiao/
repo_url: https://github.com/Boriken-Dev/guatiao
repo_name: Boriken-Dev/guatiao
edit_uri: edit/main/docs/

# Constrained to docs/ so a strict build does not scan the repo's own
# markdown -- the crate API headers and the private notes are not pages.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Passing data: ownership.md
  - Encodings: encodings.md
  - Kinds in every language: kinds.md
  - Configuration files: configuration.md
  - A bridge to another format: bridges.md
  - A bridge to another language: language-bridges.md
  - Providers on another machine: remote.md
  - A provider's form: forms.md
  - Python, host and provider: python.md
  - Node.js, host and provider: node.md
  - JavaScript without Node: js.md
  - Go, host and provider: go.md
  - Julia, host and provider: julia.md
  - R, host and provider: r.md
  - MATLAB and Octave, host and provider: matlab.md
  - Fortran, host and provider: fortran.md
  - C++, host and provider: cpp.md
  - Lua, host and provider: lua.md
  - API Reference:
      # rustdoc's own output, built by `cargo doc` and copied under
      # `rust/` by the docs workflow. An absolute URL because it is not a
      # page mkdocs knows about, and a relative one would fail --strict.
      - Rust: https://boriken-dev.github.io/guatiao/rust/guatiao/index.html
      - Python: api/python.md
      - Dart: api/dart.md
  - One library for your application: app-library.md
  - Dart and Flutter: flutter.md
  - In a browser: wasm.md
  - Migrating from 0.0.0-alpha.0: migrating.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
