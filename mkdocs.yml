site_name: guatiao
site_description: One contract for passing configuration and providers between languages
site_url: https://boriken-dev.github.io/guatiao/
repo_url: https://github.com/Boriken-Dev/guatiao
repo_name: Boriken-Dev/guatiao
edit_uri: edit/main/docs/

# Constrained to docs/ so a strict build does not scan the repo's own
# markdown -- the crate API headers and the private notes are not pages.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - API Reference:
      # rustdoc's own output, built by `cargo doc` and copied under
      # `rust/` by the docs workflow. An absolute URL because it is not a
      # page mkdocs knows about, and a relative one would fail --strict.
      - Rust: https://boriken-dev.github.io/guatiao/rust/guatiao/index.html
      - Python: api/python.md
      - Dart: api/dart.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
