[package]
name = "greeter_host"
description = "An example guatiao host: scans a search path, offers every greeter it found, and builds one from a configuration it wrote itself"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "greeter_host"
path = "src/main.rs"

[dependencies]
# `provider` for the kind traits and the derives, `load` for mapping a
# library. A host compiles against the KIND crate, never against a
# library: the libraries it loads are whatever is on disk.
guatiao = { path = "../../crates/guatiao", features = ["provider", "load"] }
greeter_kind = { path = "../greeter_kind" }
# Only to show a schema as text. The engine names no format; a host that
# wants one renders it.
guatiao-serde = { path = "../../crates/guatiao-serde", features = ["json"] }

[dev-dependencies]
# A dev-dependency's cdylib lands beside the test binary, which is how the
# test hands this host a directory holding a real library to scan. The
# binary itself does not depend on it: a host names no library.
derived_greeter = { path = "../derived_greeter" }
