language = "C"
include_guard = "GREETER_KIND_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
line_endings = "LF"
# The types the tables name are guatiao's: declared once, in its header.
sys_includes = ["guatiao.h"]

header = """
/* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at https://mozilla.org/MPL/2.0/. */

/*
 * greeter_kind -- the kind tables, for a library written in C.
 *
 * GENERATED BY cbindgen, from build.rs, by expanding #[guatiao::kind].
 * DO NOT EDIT BY HAND. Regenerate with:
 *   GUATIAO_WRITE_HEADER=1 cargo build -p greeter_kind --features c-header
 *
 * A C library fills one of these tables -- `header.struct_size` is
 * sizeof the table as compiled here, `header.floor_hash` is the
 * *_FLOOR_HASH macro beside it -- and offers it through a
 * guatiao_provider_info's `tables`, from a guatiao_library_entry of its
 * own. Every slot takes the provider's `ctx` first; an object kind's
 * table starts with `destroy`, which whoever holds the object last calls.
 */
"""

# Every table, by name. A kind crate exports no functions, so nothing
# references its tables and cbindgen would emit an empty header.
[export]
include = ["GreeterVtable", "CounterVtable", "ConversationVtable", "ListenerVtable"]

# The tables are named for Rust here and for C in the header; the types
# they refer to are guatiao's, under the names guatiao.h declares them.
# `parse_deps` is off, so those names are looked up nowhere and rendered
# through this table -- which is what keeps guatiao's types out of a
# header that includes the one defining them.
[export.rename]
"GreeterVtable" = "greeter_vtable"
"CounterVtable" = "counter_vtable"
"ConversationVtable" = "conversation_vtable"
"ListenerVtable" = "listener_vtable"
"KindHeader" = "guatiao_kind_header"
"ProviderError" = "guatiao_provider_error"
"Status" = "guatiao_status"
"Str" = "guatiao_str"
"Bytes" = "guatiao_bytes"
"Text" = "guatiao_string"
"Map" = "guatiao_map"
"List" = "guatiao_list"
"Value" = "guatiao_value"
"ObjectRaw" = "guatiao_object"
"BytesMut" = "guatiao_bytes_mut"

[parse]
parse_deps = false

# The whole reason this file exists: the tables are macro output.
[parse.expand]
crates = ["greeter_kind"]
