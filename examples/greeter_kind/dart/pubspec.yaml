name: greeter_kind
description: >-
  The greeter kinds for Dart: written by `dart run guatiao:kind` from the
  kinds' description beside their C header.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  guatiao:
    path: ../../../bindings/dart/guatiao

# The native library comes from GUATIAO_LIBRARY in the repository's own
# runs; an application leaves this out and its build hook builds it.
hooks:
  user_defines:
    guatiao:
      build: false
