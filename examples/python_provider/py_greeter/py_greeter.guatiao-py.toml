# What guatiao-source-py reads before importing anything: the module, which is
# the library (its id is the module's name), the kinds its providers
# serve, and where it is. With no `version` here, the module's own
# `__version__` is read as a literal from its source. `paths` are relative
# to this file and go on sys.path while the library is open; editing a
# `.py` file under them is what a refresh notices.
module = "py_greeter"
kinds = ["greeter", "counter"]
paths = ["."]
