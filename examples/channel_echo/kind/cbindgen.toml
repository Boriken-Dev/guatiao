language = "C"
include_guard = "CHANNEL_ECHO_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
line_endings = "LF"
sys_includes = ["guatiao.h"]

header = """
/* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at https://mozilla.org/MPL/2.0/. */

/*
 * channel_echo -- the example provider kind starting a channel.
 *
 * GENERATED BY cbindgen, from build.rs, by expanding #[guatiao::kind].
 * DO NOT EDIT BY HAND. Regenerate with:
 *   GUATIAO_WRITE_HEADER=1 cargo build -p channel_echo_kind --features c-header
 *
 * `start` takes the host's sink, a guatiao_object of the channel_sink kind
 * (guatiao_channel.h), handed over, and answers a guatiao_object of the
 * channel kind, which the caller then owns.
 */
"""

[export]
include = ["ChannelEchoVtable"]

[export.rename]
"ChannelEchoVtable" = "channel_echo_vtable"

[parse]
parse_deps = false

[parse.expand]
crates = ["channel_echo_kind"]
