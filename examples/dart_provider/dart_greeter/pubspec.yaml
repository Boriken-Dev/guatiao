name: dart_greeter
description: Greeters written in Dart, served to any host in the process.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  greeter_kind:
    path: ../../greeter_kind/dart
  guatiao:
    path: ../../../bindings/dart/guatiao

# The native library comes from GUATIAO_LIBRARY in the repository's own
# runs; an application leaves this out and its build hook builds it.
hooks:
  user_defines:
    guatiao:
      build: false
