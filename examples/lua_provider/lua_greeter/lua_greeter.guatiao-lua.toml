# What guatiao-lua reads before running anything: the module, which is
# the library (its id is the module's name), the kinds its providers
# serve, and where it is. With no `version` here, the module's own
# `_VERSION` is read as a literal from its file. `paths` are relative to
# this file: where `require` finds the module and its own modules, and
# where editing a `.lua` file is what a refresh notices.
module = "lua_greeter"
kinds = ["greeter", "counter"]
paths = ["."]
