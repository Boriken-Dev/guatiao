version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
guatiao = { path = "../../crates/guatiao", features = ["provider"] }
greeter_kind = { path = "../greeter_kind" }
