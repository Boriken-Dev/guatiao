name = "fortran_host"
version = "1.0.0"
license = "MPL-2.0"
description = "A plugin host written in Fortran"

[build]
auto-executables = true
auto-examples = false
auto-tests = true

[dependencies]
guatiao = { path = "../../bindings/fortran/guatiao" }
greeter_kind = { path = "../greeter_kind/fortran" }
fortran_greeter = { path = "../fortran_greeter" }

[[executable]]
name = "fortran_host"
source-dir = "app"
main = "fortran_host.f90"
