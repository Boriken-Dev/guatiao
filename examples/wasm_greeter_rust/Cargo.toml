[package]
name = "wasm_greeter_rust"
description = "Greeters written in Rust and compiled to WebAssembly, served by the guatiao-source-wasm source"
version = "1.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# A workspace of its own, built for wasm32-unknown-unknown only.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
guatiao-wasm-guest = { path = "../../crates/guatiao-source-wasm/guest" }

[profile.release]
# A panic stops the module: the host names it and makes the library
# afresh for the next call.
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
