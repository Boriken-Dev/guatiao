[package]
name = "wire_over_webtransport"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MPL-2.0"
publish = false
description = "Values over WebTransport: a server that announces a schema and streams values, and a native probe that receives them as a browser would"

[[bin]]
name = "wire-server"
path = "src/main.rs"

[[bin]]
name = "wire-probe"
path = "src/bin/probe.rs"

[dependencies]
guatiao = { path = "../../../crates/guatiao" }

# The two binaries' network stack, native only: the library -- the channel,
# the schema, the framing -- is what the browser client shares, and it
# builds for wasm with guatiao alone.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# WebTransport channels, server and client. A git dependency until
# coqui-web is released.
coqui-web = { git = "https://github.com/Boriken-Dev/coqui-web.git", rev = "c476a578510276a591addd4f6f5c9e578791ba11", features = ["webtransport"] }
# The short-lived certificate a browser accepts by hash, and the TLS
# configuration that presents it.
coqui-peer-tls = { version = "=0.0.0-alpha.1", features = ["generate"] }

[lints]
workspace = true
