# What guatiao-js reads before running anything: the library's id (the
# package's name, as the Node binding takes it), the kinds its providers
# serve, and where its code is. The entry module and the version are the
# package's: `package.json` beside this file. `paths` are relative to this
# file: the files a library may import, and where editing a `.js` file is
# what a refresh notices; the greeter kinds' module is outside the package.
name = "quickjs_greeter"
kinds = ["greeter", "counter"]
paths = [".", "../../greeter_kind/node"]
