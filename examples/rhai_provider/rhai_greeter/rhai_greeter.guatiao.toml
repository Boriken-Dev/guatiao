# What guatiao-source-rhai reads before running anything: the module, which is
# the library (its id is the module's name, its script `<module>.rhai`),
# the kinds its providers serve, and where it is. With no `version` here,
# the script's own `const VERSION = "...";` is read from its parse.
# `paths` are relative to this file: where the script is, and where
# editing a `.rhai` file is what a refresh notices.
type = "rhai"
module = "rhai_greeter"
kinds = ["greeter", "counter"]
paths = ["."]
