name: tally_kind
description: >-
  The tally kinds for Dart: written by `dart run guatiao:kind` from the
  description `guatiao-kind` writes from the TypeScript interfaces.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  guatiao:
    path: ../../../bindings/dart/guatiao

# The native library comes from GUATIAO_LIBRARY in the repository's own
# runs; an application leaves this out and its build hook builds it.
hooks:
  user_defines:
    guatiao:
      build: false
