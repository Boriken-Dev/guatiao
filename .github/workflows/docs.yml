name: Docs

# The only workflow that deploys Pages, so the site can be rebuilt without
# cutting a release: on a push to main that touches a docs source, and on
# demand for any ref -- which is how a release ships its docs: release.yml
# dispatches this at its tag. It cannot listen for the release itself: a
# release made with the workflow's own GITHUB_TOKEN starts no workflow.
#
# release.yml also CALLS it with `deploy: false`, as the strict docs build
# that gates a release without the release owning a deployment.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "crates/**/*.rs"
      - "bindings/python/src/**"
      - "bindings/dart/lib/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: "Deploy the built site, or only prove it builds"
        type: boolean
        required: false
        default: true
      ref:
        description: "Git ref to build"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `configure-pages` needs this to turn Pages on by itself, so a
      # fresh clone or fork does not depend on a setting somebody clicked.
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build the Rust API reference
        # Strict, so a broken intra-doc link fails here rather than
        # shipping. `--all-features` is what docs.rs would publish.
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build the Dart API reference
        # Into the package's own default output; mkdocs owns `site/`
        # until it has run, so the copy happens after it.
        run: dart pub get && dart doc
        working-directory: bindings/dart
      - name: Install the Python package and the docs tooling
        # Editable, because mkdocstrings renders the package by importing
        # it -- which needs no native library, by design.
        run: pip install -e "bindings/python[docs]"
      - name: Build the narrative site and the Python reference
        run: mkdocs build --strict
      - name: Add the Rust reference under /rust/
        # `cargo doc` writes no root index for a workspace, so the crate a
        # consumer starts from gets one.
        run: |
          mkdir -p site/rust
          cp -r target/doc/. site/rust/
          printf '%s' '<!doctype html><meta http-equiv="refresh" content="0; url=guatiao/index.html">' > site/rust/index.html
      - name: Add the Dart reference under /dart/
        # `dart doc` writes its own root index, so no redirect is needed.
        run: |
          mkdir -p site/dart
          cp -r bindings/dart/doc/api/. site/dart/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Absent outside a call, so a push or a dispatch deploys; a caller that
    # passes `deploy: false` only proves the site builds.
    if: ${{ inputs.deploy != false }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
