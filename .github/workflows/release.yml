name: Release

# A `v*` tag releases: the test suite and a strict docs build gate it, every
# manifest must name the tag's version, the packages are built and dry-run
# and the Go module checked, a GitHub release is made, and then crates.io,
# PyPI, pub.dev and npm are published and the Go module tagged -- each
# skipping a version it already has, so a re-run after a partial release
# finishes the job instead of failing on it.
#
# `workflow_dispatch` is the rehearsal: every gate, build and dry run,
# nothing released and nothing published. A release must never be the
# first time this file runs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to rehearse a release from"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test gate
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ inputs.ref || github.ref }}

  docs-gate:
    name: Docs build gate (strict, no deploy)
    uses: ./.github/workflows/docs.yml
    # What the called jobs ask for, including the deploy job this call
    # skips: a caller must grant a nested job's permissions up front.
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      deploy: false
      ref: ${{ inputs.ref || github.ref }}

  version:
    name: Every manifest names one version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade packaging
      # Cargo and pub.dev write the tag's version as it is; Python writes
      # the same version the PEP 440 way (0.0.0-alpha.0 is 0.0.0a0). The
      # tag reaches the script as data, never spliced into its source.
      - name: Compare the tag with Cargo, pyproject and pubspec
        shell: python
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          import os
          import pathlib
          import re
          import sys
          import tomllib

          from packaging.version import Version

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          python = tomllib.loads(pathlib.Path("bindings/python/pyproject.toml").read_text())["project"]["version"]
          pubspec = re.search(r"^version:\s*(\S+)", pathlib.Path("bindings/dart/pubspec.yaml").read_text(), re.M).group(1)
          init = re.search(r'^__version__ = "([^"]+)"', pathlib.Path("bindings/python/src/guatiao/__init__.py").read_text(), re.M).group(1)
          print(f"Cargo {cargo}, pubspec {pubspec}, pyproject {python}, __version__ {init}")

          problems = []
          if cargo != pubspec:
              problems.append(f"Cargo says {cargo} and pubspec says {pubspec}")
          if Version(cargo) != Version(python) or python != init:
              problems.append(f"Cargo says {cargo}, pyproject {python}, __version__ {init}")
          # guatiao-py is a workspace of its own and is not published: its
          # version and its pins on the crates still move with them.
          bridge = tomllib.loads(pathlib.Path("crates/guatiao-py/Cargo.toml").read_text())
          if bridge["package"]["version"] != cargo:
              problems.append(f"Cargo says {cargo} and guatiao-py says {bridge['package']['version']}")
          for table in ("dependencies", "dev-dependencies"):
              for name, spec in bridge.get(table, {}).items():
                  if name.startswith("guatiao") and spec.get("version") != f"={cargo}":
                      problems.append(f"guatiao-py's {table} pin {name} to {spec.get('version')}, not ={cargo}")
          # npm writes the version as Cargo does; the lockfiles name it too.
          import json
          node = json.loads(pathlib.Path("bindings/node/package.json").read_text())["version"]
          node_lock = json.loads(pathlib.Path("bindings/node/package-lock.json").read_text())
          examples_lock = json.loads(pathlib.Path("examples/package-lock.json").read_text())
          for where, found in (
              ("bindings/node/package.json", node),
              ("bindings/node/package-lock.json", node_lock["version"]),
              ("bindings/node/package-lock.json's root package", node_lock["packages"][""]["version"]),
              ("examples/package-lock.json's ../bindings/node", examples_lock["packages"]["../bindings/node"]["version"]),
          ):
              if found != cargo:
                  problems.append(f"Cargo says {cargo} and {where} says {found}")
          # Julia writes the version as Cargo does.
          julia = tomllib.loads(pathlib.Path("bindings/julia/Project.toml").read_text())["version"]
          if julia != cargo:
              problems.append(f"Cargo says {cargo} and bindings/julia/Project.toml says {julia}")
          # R's versions are integers: X.Y.Z-alpha.N is written X.Y.Z.N.
          described = re.search(r"^Version:\s*(\S+)", pathlib.Path("bindings/r/DESCRIPTION").read_text(), re.M).group(1)
          plain = re.fullmatch(r"(\d+\.\d+\.\d+)(?:-alpha\.(\d+))?", cargo)
          if not plain:
              problems.append(f"Cargo says {cargo}, which has no R version: only X.Y.Z and X.Y.Z-alpha.N map")
          else:
              want_r = plain.group(1) + (f".{plain.group(2)}" if plain.group(2) else "")
              if described != want_r:
                  problems.append(f"Cargo says {cargo}, so bindings/r/DESCRIPTION wants {want_r}, not {described}")
          # The Octave package writes the version as Cargo does; the MATLAB
          # toolbox is versioned from it when it is built.
          octave = re.search(r"^Version:\s*(\S+)", pathlib.Path("bindings/matlab/DESCRIPTION").read_text(), re.M).group(1)
          if octave != cargo:
              problems.append(f"Cargo says {cargo} and bindings/matlab/DESCRIPTION says {octave}")
          tag = os.environ["TAG"]
          if tag:
              want = tag[1:] if tag.startswith("v") else tag
              if want != cargo:
                  problems.append(f"the tag {tag} names {want}, the manifests {cargo}")
          if problems:
              sys.exit("; ".join(problems))
          print("one version:", cargo)

  build-crates:
    name: Package and verify the crates
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Packages every crate in dependency order and builds each from its
      # packaged form -- what crates.io would receive -- uploading nothing.
      - name: Dry-run the workspace publish
        run: cargo publish --workspace --dry-run
      # The dry run keeps its packages in cargo's own scratch directories,
      # so the four are packaged again for the release. Named, because
      # `--workspace` would take in the examples, which are never packaged.
      - name: Package the four crates for the release
        run: cargo package -p guatiao-derive -p guatiao -p guatiao-serde -p guatiao-intake --no-verify
      - uses: actions/upload-artifact@v4
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error

  build-python:
    name: Build and check the Python distribution
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade build twine
      - run: python -m build bindings/python --outdir dist/
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/
          if-no-files-found: error

  build-dart:
    name: Validate the Dart package
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Dry-run the pub.dev publish
        working-directory: bindings/dart
        run: dart pub get && dart pub publish --dry-run

  build-node:
    name: Build and pack the Node package
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build
        working-directory: bindings/node
        run: npm ci && npm run build
      - name: "Dry-run the pack: what npm would publish"
        working-directory: bindings/node
        run: npm pack --dry-run
      - name: Pack
        working-directory: bindings/node
        run: mkdir -p ../../npm && npm pack --pack-destination ../../npm
      - uses: actions/upload-artifact@v4
        with:
          name: node
          path: npm/
          if-no-files-found: error

  build-go:
    name: Check the Go module
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      # A Go module is published by its tag: what the tag names is the
      # files under bindings/go, built here as a consumer builds them.
      - name: Vet and build
        working-directory: bindings/go
        run: go vet ./... && go build ./...
        env:
          CGO_ENABLED: "1"
      - name: What the module ships
        shell: python
        run: |
          import subprocess

          files = subprocess.run(["git", "ls-files", "bindings/go"], capture_output=True, text=True,
                                 check=True).stdout.split()
          names = {f[len("bindings/go/"):] for f in files}
          print("\n".join(sorted(names)))
          for need in ("go.mod", "AGENTS.md", "README.md", "LICENSE", "doc.go"):
              assert need in names, f"{need} does not ship"
          assert not any(".local." in f or f.split("/")[-1].startswith(".") for f in names), "a private file ships"

  build-julia:
    name: Check the Julia package
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      # General registers the package from its subdirectory at the release
      # commit: what it takes is the files under bindings/julia, loaded here
      # as a user's Pkg loads them.
      - name: Resolve and load
        run: julia --startup-file=no --project=bindings/julia -e 'using Pkg; Pkg.instantiate(); using Guatiao; println(pkgversion(Guatiao))'
      - name: What the package ships
        shell: python
        run: |
          import subprocess
          import tomllib

          files = subprocess.run(["git", "ls-files", "bindings/julia"], capture_output=True, text=True,
                                 check=True).stdout.split()
          names = {f[len("bindings/julia/"):] for f in files}
          print("\n".join(sorted(names)))
          for need in ("Project.toml", "AGENTS.md", "README.md", "LICENSE", "src/Guatiao.jl"):
              assert need in names, f"{need} does not ship"
          assert "Manifest.toml" not in names, "a resolved environment ships"
          assert not any(".local." in f or f.split("/")[-1].startswith(".") for f in names), "a private file ships"
          project = tomllib.load(open("bindings/julia/Project.toml", "rb"))
          assert project["name"] == "Guatiao" and "julia" in project["compat"], "General wants a name and a julia compat"
          for dep in project.get("deps", {}):
              assert dep in project.get("compat", {}), f"General wants a compat entry for {dep}"

  build-r:
    name: Build and check the R package
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: libffi, which the package's glue compiles against
        run: sudo apt-get update && sudo apt-get install -y libffi-dev
      # The source package is what R-universe builds from the repository
      # and what the GitHub release carries; checked here as R checks it,
      # with no guatiao library named, so every case that needs one skips.
      - name: Build and check the source package
        run: |
          mkdir -p r
          R CMD build --no-manual bindings/r
          mv guatiao_*.tar.gz r/
          cd r
          R CMD check --no-manual guatiao_*.tar.gz
          ! grep -qE "^\* checking .*(WARNING|ERROR)" guatiao.Rcheck/00check.log
          rm -rf guatiao.Rcheck
      - name: What the package ships
        shell: python
        run: |
          import glob
          import tarfile

          (path,) = glob.glob("r/guatiao_*.tar.gz")
          names = {n.split("/", 1)[1] for n in tarfile.open(path).getnames() if "/" in n}
          print("\n".join(sorted(names)))
          for need in ("DESCRIPTION", "NAMESPACE", "README.md", "inst/AGENTS.md", "configure", "src/guatiao.h"):
              assert need in names, f"{need} does not ship"
          assert not any(".local." in n or n.split("/")[-1].startswith(".") for n in names), "a private file ships"
          assert not any(n.endswith((".o", ".so", ".dll")) for n in names), "a build output ships"
      - uses: actions/upload-artifact@v4
        with:
          name: r
          path: r/
          if-no-files-found: error

  build-octave:
    name: Build and check the Octave package
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the libraries the check calls
        run: cargo build -p guatiao -p guatiao-serde -p guatiao-intake --all-features
      - name: Octave and libffi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave octave-dev libffi-dev
      # What `pkg install` takes: DESCRIPTION, COPYING, the M files under
      # inst/ and the gateway's C sources under src/, in a folder named for
      # the package. The tests and their fixtures stay in the repository.
      - name: Build the package
        run: |
          version=$(sed -n 's/^Version: *//p' bindings/matlab/DESCRIPTION)
          mkdir -p octave stage/guatiao
          cp -r bindings/matlab/DESCRIPTION bindings/matlab/COPYING bindings/matlab/README.md \
            bindings/matlab/inst bindings/matlab/src stage/guatiao/
          tar -czf "octave/guatiao-$version.tar.gz" -C stage guatiao
          echo "OCTAVE_PACKAGE=$PWD/octave/guatiao-$version.tar.gz" >> "$GITHUB_ENV"
      - name: Install it and use it
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          octave-cli --no-gui --eval "pkg('prefix', '$RUNNER_TEMP/pkg', '$RUNNER_TEMP/pkg'); pkg('local_list', '$RUNNER_TEMP/pkg/list'); pkg('install', getenv('OCTAVE_PACKAGE')); pkg('load', 'guatiao'); v = guatiao.Value(struct('a', {{1, 2}})); assert(strcmp(guatiao.serde.emit(v), '{\"a\":[1,2]}')); assert(exist('guatiao_mex') == 3); disp('installed and working')"
        env:
          GUATIAO_LIBRARY: ${{ github.workspace }}/target/debug
      - name: What the package ships
        shell: python
        run: |
          import glob
          import tarfile

          (path,) = glob.glob("octave/guatiao-*.tar.gz")
          names = {n.split("/", 1)[1] for n in tarfile.open(path).getnames() if "/" in n}
          print("\n".join(sorted(names)))
          for need in ("DESCRIPTION", "COPYING", "README.md", "inst/AGENTS.md", "inst/+guatiao/Value.m",
                       "src/Makefile", "src/guatiao_mex.c", "src/guatiao.h"):
              assert need in names, f"{need} does not ship"
          assert not any(".local." in n or n.split("/")[-1].startswith(".") for n in names), "a private file ships"
          assert not any(n.endswith((".o", ".mex", ".oct", ".so", ".dll")) for n in names), "a build output ships"
          assert not any(n.startswith("tests") for n in names), "the tests ship"
      - uses: actions/upload-artifact@v4
        with:
          name: octave
          path: octave/
          if-no-files-found: error

  build-matlab:
    name: Build and check the MATLAB toolbox
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # ToolboxOptions takes a semantic version, which the workspace's is.
      - name: Stage the toolbox
        run: |
          version=$(sed -n 's/^Version: *//p' bindings/matlab/DESCRIPTION)
          toolbox="$version"
          mkdir -p matlab toolbox
          cp -r bindings/matlab/inst/. toolbox/
          cp -r bindings/matlab/src bindings/matlab/README.md bindings/matlab/COPYING toolbox/
          echo "TOOLBOX_VERSION=$toolbox" >> "$GITHUB_ENV"
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
      # The identifier names this toolbox across versions; it never changes.
      - name: Package the toolbox
        uses: matlab-actions/run-command@v3
        with:
          command: >
            o = matlab.addons.toolbox.ToolboxOptions(fullfile(pwd, 'toolbox'), '1ee54c3a-a864-43ba-88a0-b8d90ba97cc0');
            o.ToolboxName = 'guatiao';
            o.ToolboxVersion = getenv('TOOLBOX_VERSION');
            o.Summary = 'Values, schemas and plugin libraries across languages, over the guatiao C ABI.';
            o.Description = 'Run guatiao.build() once after installing: it compiles the MEX file (a C compiler and libffi). The guatiao library itself is not included: name it with GUATIAO_LIBRARY.';
            o.AuthorName = 'jose-pr';
            o.AuthorEmail = 'jose-pr@coqui.dev';
            o.MinimumMatlabRelease = 'R2024a';
            o.ToolboxMatlabPath = {fullfile(pwd, 'toolbox')};
            o.OutputFile = fullfile(pwd, 'matlab', 'guatiao.mltbx');
            matlab.addons.toolbox.packageToolbox(o);
            disp(o.OutputFile);
      - name: What the toolbox ships
        shell: python
        run: |
          import zipfile

          names = set(zipfile.ZipFile("matlab/guatiao.mltbx").namelist())
          print("\n".join(sorted(names)))
          for need in ("AGENTS.md", "+guatiao/Value.m", "+guatiao/build.m", "src/guatiao_mex.c", "src/guatiao.h"):
              assert any(n.endswith("fsroot/" + need) for n in names), f"{need} does not ship"
          assert not any(".local." in n for n in names), "a private file ships"
          assert not any(n.endswith((".o", ".mex", ".mexa64", ".mexw64", ".mexmaca64")) for n in names), "a build output ships"
      - uses: actions/upload-artifact@v4
        with:
          name: matlab
          path: matlab/
          if-no-files-found: error

  github-release:
    name: Create the GitHub release
    needs: [docs-gate, build-crates, build-python, build-dart, build-node, build-go, build-julia, build-r, build-octave, build-matlab]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # By name: the run holds other artifacts too (the docs gate uploads
      # the built site), and none of those is a release asset.
      - uses: actions/download-artifact@v4
        with:
          name: crates
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: node
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: r
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: octave
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: matlab
          path: dist/
      - name: Extract the CHANGELOG.md section for this tag
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop before the next "## [version]" heading, or before the
          # trailing reference-link block when this is the oldest release.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create the release
        # Pinned to a commit: this action runs with contents: write.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          # Pinned to the tagged commit; left unset it names the default
          # branch, which is not what was released.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  # --- publishing: after the GitHub release, each re-run-safe ----------------

  publish-crates:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/guatiao
    permissions:
      contents: read
      id-token: write # trusted publishing, once it is configured
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Trusted publishing can only be set up for a crate that already
      # exists, so the first release uses the CARGO_REGISTRY_TOKEN secret.
      # Once each crate trusts this workflow, set the repository variable
      # CRATES_IO_TRUSTED_PUBLISHING to `true` and delete the secret.
      - name: Exchange this run's identity for a crates.io token
        id: auth
        if: ${{ vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' }}
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish each crate crates.io does not have yet, in dependency order
        shell: python
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          import json
          import os
          import subprocess
          import sys
          import tomllib
          import urllib.error
          import urllib.request

          if not os.environ.get("CARGO_REGISTRY_TOKEN"):
              sys.exit("no crates.io token: set the CARGO_REGISTRY_TOKEN secret, "
                       "or configure trusted publishing and CRATES_IO_TRUSTED_PUBLISHING")
          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          headers = {"User-Agent": "guatiao release workflow (github.com/Boriken-Dev/guatiao)"}

          def published(name):
              url = f"https://crates.io/api/v1/crates/{name}/{version}"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as r:
                      return json.load(r).get("version", {}).get("num") == version
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return False
                  raise

          # A crate before everything that depends on it. `cargo publish`
          # waits until each is in the index before the next one starts.
          for name in ["guatiao-derive", "guatiao", "guatiao-serde", "guatiao-intake"]:
              if published(name):
                  print(f"{name} {version} is already on crates.io; skipped")
                  continue
              subprocess.run(["cargo", "publish", "-p", name], check=True)

  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/guatiao/
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI never lets a version be replaced; a re-run uploads only
          # what is missing. The version job keeps it from masking a
          # wrong tag.
          skip-existing: true

  publish-pub:
    name: Publish to pub.dev
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pub-dev
      url: https://pub.dev/packages/guatiao
    permissions:
      contents: read
      id-token: write # pub.dev automated publishing
    steps:
      - uses: actions/checkout@v4
      # Configures the OIDC token pub.dev accepts from a tag-triggered run
      # of a repository the package's admin page trusts.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Publish, unless pub.dev has this version already
        working-directory: bindings/dart
        shell: python
        run: |
          import json
          import re
          import subprocess
          import urllib.error
          import urllib.request

          version = re.search(r"^version:\s*(\S+)", open("pubspec.yaml").read(), re.M).group(1)
          try:
              with urllib.request.urlopen("https://pub.dev/api/packages/guatiao") as r:
                  have = {v["version"] for v in json.load(r)["versions"]}
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              # pub.dev automates only a package that already exists: the
              # first version is published by hand, with `dart pub publish`.
              raise SystemExit("guatiao is not on pub.dev yet: publish its first "
                               "version by hand, then enable automated publishing")
          if version in have:
              print(f"guatiao {version} is already on pub.dev; skipped")
          else:
              subprocess.run(["dart", "pub", "get"], check=True)
              subprocess.run(["dart", "pub", "publish", "--force"], check=True)

  publish-npm:
    name: Publish to npm
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/guatiao
    permissions:
      contents: read
      id-token: write # provenance, and trusted publishing once it is configured
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node
          path: npm/
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing can only be set up for a package that already
      # exists, so the first release uses the NPM_TOKEN secret. Once the
      # package trusts this workflow, set the repository variable
      # NPM_TRUSTED_PUBLISHING to `true` and delete the secret.
      - name: Publish, unless npm has this version already
        shell: python
        env:
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && secrets.NPM_TOKEN || '' }}
        run: |
          import glob
          import json
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          (tarball,) = glob.glob("npm/guatiao-*.tgz")
          version = tarball[len("npm/guatiao-"):-len(".tgz")]
          try:
              with urllib.request.urlopen("https://registry.npmjs.org/guatiao") as r:
                  have = set(json.load(r).get("versions", {}))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              have = set()
          if version in have:
              print(f"guatiao {version} is already on npm; skipped")
              sys.exit(0)
          # A pre-release goes out under `next`, never as `latest`.
          tag = "next" if "-" in version else "latest"
          subprocess.run(
              ["npm", "publish", tarball, "--provenance", "--access", "public", "--tag", tag],
              check=True,
          )

  publish-go:
    name: Tag the Go module
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A module in a subdirectory is released by a tag carrying its path:
      # bindings/go/vX.Y.Z, at the commit the release tag names. The proxy
      # is then asked for it, so it is listed at once; a re-run finds the
      # tag there and only asks again.
      - name: Push bindings/go/v<version>, unless it is there already
        shell: python
        env:
          SHA: ${{ github.sha }}
        run: |
          import os
          import subprocess
          import time
          import tomllib
          import urllib.error
          import urllib.request

          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          tag = f"bindings/go/v{version}"
          there = subprocess.run(["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}"],
                                 capture_output=True, text=True, check=True).stdout.strip()
          if there:
              print(f"{tag} is already pushed; skipped")
          else:
              subprocess.run(["git", "tag", tag, os.environ["SHA"]], check=True)
              subprocess.run(["git", "push", "origin", f"refs/tags/{tag}"], check=True)
          url = f"https://proxy.golang.org/github.com/!boriken-!dev/guatiao/bindings/go/@v/v{version}.info"
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(url) as r:
                      print("the proxy has it:", r.read().decode())
                      break
              except urllib.error.HTTPError as e:
                  print(f"the proxy answered {e.code}; asking again")
                  time.sleep(30)

  register-julia:
    name: Register the Julia package in General
    needs: github-release
    # General refuses a version with pre-release data, so a pre-release tag
    # registers nothing.
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The JuliaRegistrator app, installed on the repository, opens the
      # pull request against General when an account it trusts asks it on
      # the release commit; JULIA_REGISTRATOR_TOKEN is that account's
      # token. A version General already lists is left alone, so a re-run
      # finishes a partly failed release.
      - name: Ask Registrator for this version, unless General has it
        shell: python
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.JULIA_REGISTRATOR_TOKEN }}
        run: |
          import json
          import os
          import sys
          import tomllib
          import urllib.error
          import urllib.request

          project = tomllib.load(open("bindings/julia/Project.toml", "rb"))
          name, version = project["name"], project["version"]
          versions = f"https://raw.githubusercontent.com/JuliaRegistries/General/master/{name[0]}/{name}/Versions.toml"
          try:
              with urllib.request.urlopen(versions) as r:
                  listed = tomllib.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              listed = {}
          if version in listed:
              print(f"General lists {name} {version}; skipped")
              sys.exit(0)
          if not os.environ["TOKEN"]:
              sys.exit("JULIA_REGISTRATOR_TOKEN is not set: nothing asked Registrator")
          body = json.dumps({"body": "@JuliaRegistrator register subdir=bindings/julia"}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=body, method="POST",
              headers={"Authorization": f"Bearer {os.environ['TOKEN']}", "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request) as r:
              print("asked Registrator:", json.loads(r.read())["html_url"])

  # A GITHUB_TOKEN-made release starts no workflow, so docs.yml is
  # dispatched at this tag instead. A pre-release leaves the published docs
  # alone, and this is off the publish chain: a docs problem never blocks a
  # package that passed its tests.
  docs-deploy:
    name: Deploy the docs for this release
    needs: github-release
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs.yml at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
