name: CLA

# A contributor signs once, by replying to the bot's comment on their first
# pull request. The signature is recorded in a JSON file on a branch of this
# repository, so there is no external service holding the record.
#
# `pull_request_target` rather than `pull_request` is required and is not an
# oversight: the job needs write access to record a signature, and a
# `pull_request` run from a fork gets a read-only token. `pull_request_target`
# runs the workflow **from the base branch**, so a fork cannot alter what
# runs here by editing this file in its own branch. Nothing in this job
# checks out or executes the pull request's code, which is the rule that
# makes `pull_request_target` safe to use.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: Check the contributor licence agreement
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Where signatures are stored: a file on a branch of this repo.
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # What the contributor is agreeing to.
          path-to-document: https://github.com/Boriken-Dev/guatiao/blob/main/CLA.md
          # The maintainer's own commits do not need a signature, and nor do
          # bots. Anyone else does.
          allowlist: jose-pr,bot*,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged we need a
            one-time contributor licence agreement, which lets this project
            be relicensed later without chasing every past contributor. Read
            [CLA.md](https://github.com/Boriken-Dev/guatiao/blob/main/CLA.md),
            then reply to this thread with exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
