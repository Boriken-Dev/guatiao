name: Test

# On-demand test workflow, kept separate from any future release workflow:
# workflow_dispatch (with a ref input) plus throwaway "ci-*" tags, deleted
# after the run. Not triggered by push/PR on branches by default.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # stable + the declared MSRV; both must pass. Keep this in step
        # with `rust-version` in the workspace Cargo.toml.
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        # `--all-targets`, so tests and examples are linted too -- the same
        # invocation the local gate runs.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        # `cargo test` does not build a cdylib for the package under
        # test, and `c_exports` links one. Building first is what keeps
        # that test from turning into a stated skip on every run.
        # `--all-features` also turns on `c-header`, so the committed
        # header is compared against a fresh render.
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs
        # Strict, so a broken intra-doc link fails here rather than
        # accumulating. `--all-features` because that is the build docs.rs
        # publishes (`[package.metadata.docs.rs] all-features = true`): a
        # link to a feature-gated item is only resolvable there.
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: Python bindings (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The same suite on the three platforms, because this is where a
    # binding breaks: the library's filename, how it is found, and how
    # ctypes lays out a struct are each per platform. Every supported
    # version on Linux, the edges on Windows and macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native libraries
        # The bindings drive a shared library, and `--all-features` is
        # what exports the registry surface and the serde formats.
        run: cargo build --workspace --all-features
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "bindings/python[dev]"
      - name: Test
        run: pytest bindings/python/tests -rs
        env:
          GUATIAO_LIBRARY: target/debug

  dart:
    name: Dart bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The same three platforms as the Python job, for the same reason: a
    # binding breaks where the platforms differ -- the library's filename,
    # how it is found, and how the loader treats an unmapped image.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native libraries
        # The bindings drive a shared library, and `--all-features` is
        # what exports the registry surface and the serde formats.
        run: cargo build --workspace --all-features
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install
        run: dart pub get
        working-directory: bindings/dart
      - name: Analyze
        # `--fatal-infos`, because a lint at info level is still a lint.
        run: dart analyze --fatal-infos
        working-directory: bindings/dart
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
        working-directory: bindings/dart
      - name: Test
        run: dart test
        working-directory: bindings/dart
        env:
          # Absolute: the job runs from the package directory, so a path
          # relative to the workspace would not resolve.
          GUATIAO_LIBRARY: ${{ github.workspace }}/target/debug
