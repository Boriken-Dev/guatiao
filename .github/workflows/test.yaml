name: Test

# On-demand test workflow: workflow_dispatch (with a ref input) plus
# throwaway "ci-*" tags, deleted after the run. Not triggered by push/PR on
# branches. release.yml calls it as its test gate, so a release runs exactly
# the suite a ci-* tag does -- never a copy that drifted.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # stable + the declared MSRV; both must pass. Keep this in step
        # with `rust-version` in the workspace Cargo.toml.
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        # `--all-targets`, so tests and examples are linted too -- the same
        # invocation the local gate runs.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        # `cargo test` does not build a cdylib for the package under
        # test, and `c_exports` links one. Building first is what keeps
        # that test from turning into a stated skip on every run.
        # `--all-features` also turns on `c-header`, so the committed
        # header is compared against a fresh render.
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Test guatiao-serde with its default features
        # `--all-features` turns on `exact-numbers`, which compiles out the
        # tests only a default build has: that the crate leaves other
        # crates' serde_json numbers alone, and that a wide number reads
        # through an `f64` without the feature.
        run: cargo test -p guatiao-serde

      - name: Docs
        # Strict, so a broken intra-doc link fails here rather than
        # accumulating. `--all-features` because that is the build docs.rs
        # publishes (`[package.metadata.docs.rs] all-features = true`): a
        # link to a feature-gated item is only resolvable there.
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    # Undefined behaviour the tests pass through: the value model is repr(C)
    # unions, raw slices and a hand-rolled drop. Only the tests that load no
    # library run here -- Miri cannot map one -- and the one deep-tree test is
    # skipped for time, not weakened. The nightly is pinned so a run means
    # the same thing twice.
    name: Miri (value model, loader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: The value model and the schema, unit tests
        run: "cargo miri test -p guatiao --all-features --lib -- value:: schema::"
      - name: The value model, integration tests
        run: >-
          cargo miri test -p guatiao --all-features
          --test container_roundtrip --test std_traits --test public_surface
          --test exports_boundary --test schema_as_value
          --test kind_glue_probes --test schema_constraints --test schema_annotations
          --test status_codes --test ownership
          -- --skip a_tree_of_any_depth
      - name: The path grammar and the flat projection, in the crate that has them
        # They moved out of `guatiao` with the rest of the projection; the
        # walk is the same kind of thing Miri is here for -- it reads and
        # rebuilds trees a caller supplied.
        run: >-
          cargo miri test -p guatiao-intake --all-features
          --test paths --test flat_projection
      - name: The wire decoder, which reads bytes nobody vouched for
        # The three heavy tests (random inputs, a deep tree, a thousand keys)
        # run natively; under Miri they take minutes and add no new path.
        run: >-
          cargo miri test -p guatiao --all-features --test wire_roundtrip --test wire_channel
          -- --skip ten_thousand_random --skip a_tree_deeper_than --skip a_thousand_keys
      - name: The loader, the kind runtime and sources, under Stacked Borrows
        # The directories with the most `unsafe`, through descriptors the
        # host links rather than loads, and a source a host links. Registering
        # resolves a path, hence isolation off; the block a registry hands
        # its libraries is leaked by design, hence the leak check off.
        # `scan::` holds no `unsafe` and reads directories, so it runs
        # natively only.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks
        run: >-
          cargo miri test -p guatiao --all-features --lib
          -- library::raw:: library::kind:: library::registry:: library::source::
          && cargo miri test -p guatiao --all-features
          --test host_lookups --test provider_offers
      - name: The loader, the kind runtime and sources, under Tree Borrows
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks -Zmiri-tree-borrows
        run: >-
          cargo miri test -p guatiao --all-features --lib
          -- library::raw:: library::kind:: library::registry:: library::source::
          && cargo miri test -p guatiao --all-features
          --test host_lookups --test provider_offers

  public-api:
    # A change to what a consumer can name must be a line somebody wrote:
    # each crate commits its surface, and a difference here fails with the
    # diff. Regenerate with the command in AGENTS.md, in the same commit.
    name: Public API snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - uses: Swatinem/rust-cache@v2
      - name: Compare each crate with its snapshot
        shell: bash
        run: |
          status=0
          for crate in guatiao guatiao-serde guatiao-intake; do
            cargo public-api -p "$crate" --all-features -ss > "$RUNNER_TEMP/$crate.txt"
            diff -u "crates/$crate/public-api.txt" "$RUNNER_TEMP/$crate.txt" || status=1
          done
          exit $status

  wasm:
    # The crates build for a browser. The layout is written in pointer
    # widths, so wasm32 (4-byte pointers) is the same contract as 64-bit.
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check the crates for wasm32
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p guatiao -p guatiao-serde -p guatiao-intake
          --features guatiao/derive,guatiao/provider,guatiao-serde/json,guatiao-serde/toml,guatiao-serde/yaml
      - name: Build the module
        run: cargo build -p guatiao --target wasm32-unknown-unknown --release
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: The module exports the C surface, the wire encoding included
        shell: bash
        run: |
          exports=$(wasm-tools print target/wasm32-unknown-unknown/release/guatiao.wasm | grep -c '(export "guatiao_')
          wire=$(wasm-tools print target/wasm32-unknown-unknown/release/guatiao.wasm | grep -c '(export "guatiao_wire_')
          echo "guatiao_* exports: $exports, wire: $wire"
          test "$wire" -eq 2 && test "$exports" -ge 20
      - name: The wire encoding
        run: cargo test -p guatiao --test wire_roundtrip --test wire_channel
      - name: The WebTransport example's page
        # Its own workspace and lockfile; `--locked` builds exactly the
        # `wasm-bindgen` the README tells the reader to install a CLI for.
        # It runs from the page's directory: that is where its target and
        # rustflags are configured.
        run: cargo build --release --locked
        working-directory: examples/wire_over_webtransport/client

  python:
    name: Python bindings (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The same suite on the three platforms, because this is where a
    # binding breaks: the library's filename, how it is found, and how
    # ctypes lays out a struct are each per platform. Every supported
    # version on Linux, the edges on Windows and macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native libraries
        # The bindings drive a shared library, and `--all-features` is
        # what exports the registry surface and the serde formats.
        run: cargo build --workspace --all-features
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the guatiao-py bridge against this Python
        # So `test_bridge` and the example host's bridge leg run rather
        # than skip: a Python host serving Python libraries through it.
        run: cargo build --manifest-path crates/guatiao-py/Cargo.toml
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Install
        run: pip install -e "bindings/python[dev]"
      - name: Test
        run: pytest bindings/python/tests -rs
        env:
          GUATIAO_LIBRARY: target/debug
      - name: Types
        # One leg is enough: the binding and the Python examples under
        # mypy --strict, so a provider that misspells a kind's method or
        # its types fails here rather than in a host.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: >-
          mypy --strict bindings/python/src/guatiao examples/python_provider/py_greeter examples/python_provider/py_tally examples/greeter_kind/python examples/python_host
        env:
          MYPYPATH: bindings/python/src:examples/greeter_kind/python

  bridge:
    name: guatiao-py (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The bridge from hosts that are not Python: a Rust host (its tests and
    # the example host) and a C host, each adding it as a source and
    # calling greeters written in Python. Its own workspace, so its
    # format, lint and tests run here and nowhere else. A stated skip
    # (no bridge, no compiler) fails the job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/guatiao-py
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Where a host that is not Python finds libpython
        # The bridge names libpython by its file name; this Python is not
        # installed where the loader looks by default.
        if: runner.os != 'Windows'
        run: |
          echo "LD_LIBRARY_PATH=$pythonLocation/lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$pythonLocation/lib" >> "$GITHUB_ENV"
      - name: Build the workspace
        # The guatiao library the C host links, and the example host.
        run: cargo build --workspace --all-features
      - name: Format check and clippy
        working-directory: crates/guatiao-py
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Build the bridge
        run: cargo build --manifest-path crates/guatiao-py/Cargo.toml
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: What the bridge links to reach Python
        run: |
          case "$RUNNER_OS" in
            Linux)   readelf -d crates/guatiao-py/target/debug/libguatiao_py.so | grep NEEDED ;;
            macOS)   otool -L crates/guatiao-py/target/debug/libguatiao_py.dylib ;;
            Windows) llvm-readobj --coff-imports crates/guatiao-py/target/debug/guatiao_py.dll | grep 'Name:' ;;
          esac
      - name: Test, from a Rust host and a C host
        run: |
          cargo test --manifest-path crates/guatiao-py/Cargo.toml -- --nocapture 2>&1 | tee bridge-test.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -n "skipped:" bridge-test.log
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
          GUATIAO_LIBRARY: ${{ github.workspace }}/target/debug
      - name: The example host serves the Python greeters
        run: |
          case "$RUNNER_OS" in
            Linux)   bridge=crates/guatiao-py/target/debug/libguatiao_py.so ;;
            macOS)   bridge=crates/guatiao-py/target/debug/libguatiao_py.dylib ;;
            Windows) bridge=crates/guatiao-py/target/debug/guatiao_py.dll ;;
          esac
          GREETER_HOST_SOURCE=$bridge \
          GREETER_HOST_SOURCE_CONFIG='{"dirs": ["examples/python_provider"],
            "paths": ["bindings/python/src", "examples/greeter_kind/python"]}' \
            cargo run -p greeter_host 2>&1 | tee host.log
          grep -q "served py_greeter as py_greeter" host.log
          grep -q "py_greeter_hello greets: hello, ana" host.log
          grep -q "py_greeter_shouter configured with" host.log

  node:
    name: Node bindings (node${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The previous and the current LTS on the three platforms: the
    # library's filename, how it is found and koffi's prebuilt part are
    # each per platform. The greeters are written in Rust, C, Python
    # (through the guatiao-py bridge) and TypeScript, and a stated skip
    # (no compiler, no bridge) fails the job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/guatiao-py
      - name: Build native libraries
        # The libraries, the Rust greeters and the Rust caller of any
        # greeter (`examples/greeter_caller`).
        run: cargo build --workspace --all-features
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.14"
      - name: Where a host that is not Python finds libpython
        if: runner.os != 'Windows'
        run: |
          echo "LD_LIBRARY_PATH=$pythonLocation/lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$pythonLocation/lib" >> "$GITHUB_ENV"
      - name: Build the guatiao-py bridge, for the Python greeters
        run: cargo build --manifest-path crates/guatiao-py/Cargo.toml
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            bindings/node/package-lock.json
            examples/package-lock.json
      - name: Install
        working-directory: bindings/node
        run: npm ci
      - name: Types
        # tsc --strict over the sources, the tests (whose type-check file
        # must meet every expected error) and the examples.
        working-directory: bindings/node
        run: npm run typecheck
      - name: Build
        working-directory: bindings/node
        run: npm run build
      - name: Install the examples, against the build
        working-directory: examples
        run: npm ci
      - name: The examples, as a consumer of the published types
        working-directory: bindings/node
        run: npx tsc -p ../../examples/tsconfig.json
      - name: Test
        working-directory: bindings/node
        run: |
          case "$RUNNER_OS" in
            Linux)   bridge=libguatiao_py.so ;;
            macOS)   bridge=libguatiao_py.dylib ;;
            Windows) bridge=guatiao_py.dll ;;
          esac
          export GUATIAO_PY_BRIDGE="$GITHUB_WORKSPACE/crates/guatiao-py/target/debug/$bridge"
          npm test 2>&1 | tee node-test.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -nE "[0-9]+ skipped" node-test.log
        env:
          GUATIAO_LIBRARY: ${{ github.workspace }}/target/debug
          NO_COLOR: "1"
      - name: What the package ships
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        working-directory: bindings/node
        run: |
          npm pack --dry-run --json > pack.json
          python3 - <<'EOF'
          import json
          files = {f["path"] for f in json.load(open("pack.json"))[0]["files"]}
          print("\n".join(sorted(files)))
          for need in ("AGENTS.md", "README.md", "LICENSE", "package.json", "dist/index.js", "dist/index.d.ts"):
              assert need in files, f"{need} does not ship"
          stray = [f for f in files if not (f.startswith("dist/") or f in ("AGENTS.md", "README.md", "LICENSE", "package.json"))]
          assert not stray, f"ships what it should not: {stray}"
          assert not any(".local." in f for f in files), "a .local file ships"
          EOF

  dart:
    name: Dart bindings (${{ matrix.os }}, ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    # The same three platforms as the Python job, for the same reason: a
    # binding breaks where the platforms differ -- the library's filename,
    # how it is found, and how the loader treats an unmapped image. One
    # more leg runs the floor `pubspec.yaml` declares.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: '3.6.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native libraries
        # The bindings drive a shared library, and `--all-features` is
        # what exports the registry surface and the serde formats.
        run: cargo build --workspace --all-features
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install
        run: dart pub get
        working-directory: bindings/dart
        if: matrix.sdk == 'stable'
      - name: Install without the tooling that needs a newer SDK
        # `ffigen` and `lints` ask for a newer SDK than the package does and
        # only the stable leg uses them; the floor leg builds and tests the
        # package against what its own `sdk:` constraint admits.
        run: dart pub remove ffigen lints
        working-directory: bindings/dart
        if: matrix.sdk != 'stable'
      - name: Analyze
        # `--fatal-infos`, because a lint at info level is still a lint.
        run: dart analyze --fatal-infos
        working-directory: bindings/dart
        if: matrix.sdk == 'stable'
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
        working-directory: bindings/dart
        if: matrix.sdk == 'stable'
      - name: Test
        run: dart test
        if: matrix.sdk == 'stable'
        working-directory: bindings/dart
        env:
          # Absolute: the job runs from the package directory, so a path
          # relative to the workspace would not resolve.
          GUATIAO_LIBRARY: ${{ github.workspace }}/target/debug
      - name: Test on the floor
        # Only the top-level suites: `test/stable_only/` holds what needs an
        # SDK newer than the floor, and one file that does not compile there
        # fails the whole run.
        run: dart test test/*_test.dart
        if: matrix.sdk != 'stable'
        working-directory: bindings/dart
        env:
          # Absolute: the job runs from the package directory, so a path
          # relative to the workspace would not resolve.
          GUATIAO_LIBRARY: ${{ github.workspace }}/target/debug
