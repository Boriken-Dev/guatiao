name: Test

# On-demand test workflow, kept separate from any future release workflow:
# workflow_dispatch (with a ref input) plus throwaway "ci-*" tags, deleted
# after the run. Not triggered by push/PR on branches by default.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # stable + the declared MSRV; both must pass. Keep this in step
        # with `rust-version` in the workspace Cargo.toml.
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        # `--all-targets`, so tests and examples are linted too -- the same
        # invocation the local gate runs.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        # `cargo test` does not build a cdylib for the package under
        # test, and `c_exports` links one. Building first is what keeps
        # that test from turning into a stated skip on every run.
        # `--all-features` also turns on `c-header`, so the committed
        # header is compared against a fresh render.
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs
        # Strict, so a broken intra-doc link fails here rather than
        # accumulating. `--all-features` because that is the build docs.rs
        # publishes (`[package.metadata.docs.rs] all-features = true`): a
        # link to a feature-gated item is only resolvable there.
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
