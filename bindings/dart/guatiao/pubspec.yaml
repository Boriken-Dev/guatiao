name: guatiao
description: >-
  Dart bindings over the guatiao C ABI, through dart:ffi or a WebAssembly
  module on the web: a value model, a JSON Schema that describes a value,
  and a registry that loads plugin libraries.
version: 0.0.0-alpha.1
repository: https://github.com/Boriken-Dev/guatiao
issue_tracker: https://github.com/Boriken-Dev/guatiao/issues
documentation: https://boriken-dev.github.io/guatiao/

# `dart:ffi` on each native platform; on the web, the WebAssembly module
# the page loads.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  # The build hook (package:guatiao/hook.dart): cargo builds the library
  # for the target a Flutter or Dart build names.
  code_assets: ^1.0.0
  # The remote protocol's key proof, HMAC-SHA256 (package:guatiao/remote.dart);
  # already in the build through package:hooks.
  crypto: ^3.0.0
  ffi: ^2.1.0
  hooks: '>=1.0.0 <3.0.0'

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.0.0
  # The browser suites talk to the test machine through it; under dart2wasm
  # a number arrives as a double before 2.1.1.
  stream_channel: ^2.1.1
  test: ^1.25.0

# This package's own suites run against the libraries GUATIAO_LIBRARY
# names, built by cargo beforehand: as the root package, its hook builds
# nothing. An application depending on it is unaffected.
hooks:
  user_defines:
    guatiao:
      build: false
