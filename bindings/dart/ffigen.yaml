# Generates lib/src/bindings.g.dart from the committed C headers.
#
# Regenerate with: dart run ffigen --config ffigen.yaml
#
# **Check that the output is not empty.** ffigen does not fail on an entry
# point it cannot find: it reports `Input Headers: []` and writes a file
# with no bindings in it, which deletes the whole surface silently.
name: GuatiaoBindings
description: >-
  Raw dart:ffi bindings over the guatiao C ABI, generated from
  crates/guatiao/include/guatiao.h and the sibling headers for the serde
  and form libraries.
# `symbol-file` is what lets ANOTHER package's ffigen run reuse these
# type definitions instead of minting its own. Dart's FFI structs are
# nominal: without it, a `Pointer<guatiao_value>` generated over there is
# a different type from one generated here and the two cannot be passed
# between packages at all. A consumer writes
# `import: { symbol-files: ['package:guatiao/src/symbols.yaml'] }`.
output:
  bindings: 'lib/src/bindings.g.dart'
  symbol-file:
    output: 'package:guatiao/src/symbols.yaml'
    import-path: 'package:guatiao/src/bindings.g.dart'

headers:
  entry-points:
    - '../../crates/guatiao/include/guatiao.h'
    - '../../crates/guatiao-serde/include/guatiao_serde.h'
    - '../../crates/guatiao-form/include/guatiao_form.h'
  include-directives:
    - '**guatiao.h'
    - '**guatiao_serde.h'
    - '**guatiao_form.h'

compiler-opts:
  - '-I../../crates/guatiao/include'
  # guatiao_serde.h guards its TOML and YAML entry points behind these;
  # without them ffigen binds only the JSON half, and `serde.dart` then
  # has nothing to call for a format the loaded library may well export.
  - '-DGUATIAO_SERDE_TOML'
  - '-DGUATIAO_SERDE_YAML'

