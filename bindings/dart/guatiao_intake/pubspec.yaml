name: guatiao_intake
description: >-
  Forms over a schema, paths and the flat key-to-text store for guatiao
  values, over the guatiao_intake C ABI and package:guatiao.
version: 0.0.0-alpha.1
repository: https://github.com/Boriken-Dev/guatiao
issue_tracker: https://github.com/Boriken-Dev/guatiao/issues
documentation: https://boriken-dev.github.io/guatiao/

# `dart:ffi` on each native platform; on the web, the WebAssembly module
# the page loads.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  # The value model, errors and loader, released together: the minimum is
  # this package's own version (pub refuses a dependency on one version).
  guatiao: ^0.0.0-alpha.1

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.0.0
  # The browser suites talk to the test machine through it; under dart2wasm
  # a number arrives as a double before 2.1.1.
  stream_channel: ^2.1.1
  test: ^1.25.0

# This package's own suites run against the libraries GUATIAO_LIBRARY
# names, built by cargo beforehand: as the root package, its hook builds
# nothing. An application depending on it is unaffected.
hooks:
  user_defines:
    guatiao:
      build: false
