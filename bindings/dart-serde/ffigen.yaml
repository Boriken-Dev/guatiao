# Generates lib/src/bindings.g.dart from the committed C header.
#
# Regenerate with: dart run ffigen --config ffigen.yaml
#
# **Check that the output is not empty.** ffigen does not fail on an entry
# point it cannot find: it reports `Input Headers: []` and writes a file
# with no bindings in it, which deletes the whole surface silently.
name: GuatiaoSerdeBindings
description: >-
  Raw dart:ffi bindings over the guatiao_serde C ABI, generated from
  crates/guatiao-serde/include/guatiao_serde.h.
# Every type guatiao.h declares comes from package:guatiao, so a
# `Pointer<guatiao_value>` here is the one its `Value` holds.
import:
  symbol-files:
    - 'package:guatiao/ffi_symbols.yaml'
output:
  bindings: 'lib/src/bindings.g.dart'

headers:
  entry-points:
    - '../../crates/guatiao-serde/include/guatiao_serde.h'
  include-directives:
    - '**guatiao_serde.h'

compiler-opts:
  - '-I../../crates/guatiao/include'
  # guatiao_serde.h guards its TOML and YAML entry points behind these;
  # without them ffigen binds only the JSON half, and `serde.dart` then
  # has nothing to call for a format the loaded library may well export.
  - '-DGUATIAO_SERDE_TOML'
  - '-DGUATIAO_SERDE_YAML'

preamble: |
  // This Source Code Form is subject to the terms of the Mozilla Public
  // License, v. 2.0. If a copy of the MPL was not distributed with this
  // file, You can obtain one at https://mozilla.org/MPL/2.0/.
