[workspace]
resolver = "2"
members = [
    "crates/guatiao",
    "crates/guatiao-derive",
    "crates/guatiao-serde",
    "crates/guatiao-form",
    "examples/hello_library",
]

# Four crates plus an example library. `guatiao-derive` exists only
# because a proc-macro crate cannot be anything else, and is reached
# through `guatiao = { features = ["derive"] }` rather than named in a
# consumer's manifest. `guatiao-serde` is separate for the opposite
# reason: it is the one crate here that resolves dependencies, and the core
# stays free of them. `guatiao-form` is separate because only a consumer
# that draws a screen needs it.
#
# Everything a consumer names -- the value model, the C type vocabulary,
# the schema, the envelope, the loader -- is in `guatiao`. The example is a
# real cdylib the test suite builds and loads; an envelope is not something
# prose can demonstrate.

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV: the lowest toolchain every step of the test workflow has been run
# on. Let chains, used throughout, set a floor of 1.88 by themselves; 1.88
# itself has not been run, so the declared value is the verified one.
rust-version = "1.89"
repository = "https://github.com/Boriken-Dev/guatiao"
license = "MPL-2.0"

# `publish = false` even though the licence is settled, and the two are
# unrelated: the licence says what a recipient may do, this says the crate
# is not offered on a registry yet. Lift it when the repository goes
# public, not before.
publish = false
